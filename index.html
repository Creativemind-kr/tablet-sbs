<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBS아카데미AIX학원 — 강좌 안내</title>
  <meta name="description" content="시각편집·CG·모션그래픽·웹디자인·프로그래밍·인테리어·자격증 등 전문 디자인 정규과정 안내">
  <!-- Open Graph (카카오톡·SNS 링크 미리보기) -->
  <meta property="og:type"        content="website">

  <meta property="og:description" content="시각편집·CG·모션그래픽·웹디자인·프로그래밍·인테리어·자격증 등 전문 디자인 정규과정 안내">

    // QR로 들어온 학생 휴대폰(?pdf=학과id 또는 roadmap): 사이트 대신 PDF 받는 화면만

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SBS아카데미">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=optional" rel="stylesheet">
  <!-- Pretendard: 학원 소개(첫 페이지) 전용 -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <!-- Firebase compat CDN — app+firestore는 defer로 조기 로드, storage는 필요 시 동적 로드 -->
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
  /* ══════════════════════════════════════
     1. TOKENS & COURSE COLOR SYSTEM
  ══════════════════════════════════════ */
  :root {
    --c-bg:           #ffffff;
    --c-bg-2:         #f7f7f5;
    --c-text:         #111111;
    --c-text-2:       #555555;
    --c-text-3:       #777777;
    --c-border:       #e8e8e8;
    --c-black:        #000000;

    --c-course:       #111111;
    --c-course-tint:  #f7f7f5;

    --font: 'Noto Sans KR', -apple-system, sans-serif;

    --t-xs:   0.72rem;
    --t-sm:   0.85rem;
    --t-md:   1rem;
    --t-lg:   1.15rem;
    --t-xl:   1.4rem;
    --t-2xl:  1.8rem;
    --t-3xl:  2.4rem;
    --t-4xl:  3.2rem;
    --t-hero: 4.8rem;

    --ease:   cubic-bezier(0.16, 1, 0.3, 1);
    --fast:   130ms;
    --base:   260ms;

    --c-accent: #1E3461;
  }

  .app.c-web   { --c-course: #3B82F6; --c-course-tint: #EFF6FF; }
  .app.c-ps    { --c-course: #F97316; --c-course-tint: #FFF7ED; }
  .app.c-video { --c-course: #EF4444; --c-course-tint: #FEF2F2; }
  .app.c-uiux  { --c-course: #8B5CF6; --c-course-tint: #F5F3FF; }
  .app.c-ai    { --c-course: #0EA5E9; --c-course-tint: #F0F9FF; }

  /* ══════════════════════════════════════
     2. RESET
  ══════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    color: var(--c-text);
    background: var(--c-bg);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  #page-intro { font-family: 'Pretendard Variable', Pretendard, var(--font); }
  #page-intro :is(input, textarea, select) { font-family: inherit; }
  /* Pretendard는 기본 자간이 좁아 Noto 기준 음수 자간을 완화 */
  #page-intro .hero-title { letter-spacing: -.015em; line-height: 1.12; word-break: keep-all; font-size: min(var(--t-hero), 4.2rem); }
  #page-intro .stat-num   { letter-spacing: -.01em; line-height: 1.15; }
  button {
    cursor: pointer; border: none; background: none;
    font: inherit; color: inherit;
    touch-action: manipulation;
  }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  /* ══════════════════════════════════════
     3. LAYOUT
  ══════════════════════════════════════ */
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* ══════════════════════════════════════
     4. HEADER
  ══════════════════════════════════════ */
  .header {
    flex-shrink: 0;
    height: 58px;
    border-bottom: 1px solid var(--c-border);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 28px;
    background: var(--c-bg);
    position: relative;
    z-index: 10;
  }
  .header__logo {
    font-size: var(--t-sm);
    font-weight: 800;
    letter-spacing: -0.02em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .header__logo span {
    color: var(--c-text-3);
    font-weight: 400;
    margin-left: 6px;
    font-size: var(--t-xs);
  }
  .main-nav {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .main-nav::-webkit-scrollbar { display: none; }
  .main-nav__btn {
    padding: 7px 15px;
    border-radius: 8px;
    font-size: var(--t-sm);
    font-weight: 500;
    color: var(--c-text-2);
    white-space: nowrap;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: background var(--fast), color var(--fast);
  }
  .main-nav__btn .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--c-border);
    flex-shrink: 0;
    transition: background var(--base);
  }
  .main-nav__btn:hover { color: var(--c-text); background: var(--c-bg-2); }
  .main-nav__btn.is-active { color: var(--c-text); font-weight: 700; background: var(--c-bg-2); }
  .main-nav__btn.is-active .dot { background: var(--c-course); }

  .header__indicator {
    margin-left: auto;
    font-size: var(--t-xs);
    color: var(--c-text-3);
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    padding: 8px 4px;
  }

  /* ══════════════════════════════════════
     5. CONTENT AREA & PAGES
  ══════════════════════════════════════ */
  .content-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px) scale(0.99);
    transition: opacity 220ms var(--ease), transform 220ms var(--ease);
    padding: 44px 40px 64px;
  }
  .page.is-active {
    opacity: 1;
    pointer-events: auto;
    transform: none;
  }
  .page.exit {
    opacity: 0;
    transform: translateY(-6px) scale(0.99);
    transition: opacity 150ms, transform 150ms;
  }
  .app.is-admin .page { padding-bottom: 80px; }
  .page__inner { max-width: 860px; margin: 0 auto; }
  .page-label {
    font-size: var(--t-xl);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: none;
    color: var(--c-text);
    margin-bottom: 20px;
    line-height: 1.1;
  }
  .page-label-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .page-label-row .page-label { margin-bottom: 20px; }
  .pretest-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    background: var(--c-accent);
    color: #fff;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: var(--t-sm);
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 20px;
    white-space: nowrap;
  }
  .pretest-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .page-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .page-btns .pretest-btn { margin-bottom: 0; }
  /* PDF 받기(태블릿에 QR → 학생 휴대폰) */
  .pdf-btn {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; margin-bottom: 20px;
    padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--c-accent); background: #fff; color: var(--c-accent);
    font: inherit; font-size: var(--t-sm); font-weight: 700; white-space: nowrap; cursor: pointer;
  }
  .page-btns .pdf-btn, #page-roadmap .pdf-btn { margin-bottom: 0; }
  .pdf-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .pdf-btn:active { background: var(--c-bg-2); }
  /* PDF 만드는 중·완료 창 */
  .pdfx { position: fixed; inset: 0; z-index: 1200; display: grid; place-items: center; padding: 20px; background: rgba(15,23,42,.45); }
  .pdfx[hidden] { display: none; }
  .pdfx__box { width: min(420px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; box-sizing: border-box; padding: 24px 22px 20px; border-radius: 18px; background: #fff; box-shadow: 0 16px 40px rgba(15,23,42,.25); text-align: center; }
  .pdfx__title { margin: 0; font-size: 19px; font-weight: 800; color: var(--c-text); word-break: keep-all; }
  .pdfx__sub { margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--c-text-2); word-break: keep-all; white-space: pre-line; }
  .pdfx__qr:empty { display: none; }
  .pdfx__qr { width: min(260px, 100%); margin: 16px auto 0; }
  .pdfx__qr svg { display: block; width: 100%; height: auto; }
  html.pdf-only, html.pdf-only body { background: #f1f5f9; }
  html.pdf-only .app { display: none !important; }
  .pdfx__btns { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .pdfx__btns:empty { display: none; }
  .pdfx__btn { height: 48px; border-radius: 12px; border: 1px solid var(--c-border); background: #fff; font: inherit; font-size: 15px; font-weight: 700; color: var(--c-text); cursor: pointer; }
  .pdfx__btn--main { border: 0; background: var(--c-accent); color: #fff; }
  .pdfx__spin { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 4px solid #e2e8f0; border-top-color: var(--c-accent); animation: pdfxSpin .8s linear infinite; }
  @keyframes pdfxSpin { to { transform: rotate(360deg); } }
  /* PDF용으로 화면 밖에 그리는 칸 */
  .pdf-host { position: absolute; left: -30000px; top: 0; background: #fff; color: var(--c-text); }
  .pdf-host .accordion__body { max-height: none !important; overflow: visible !important; }
  .pdf-host .rmd { animation: none; min-height: 0; height: 100%; }
  .pdf-host .rmd__ex-fig img { aspect-ratio: 16 / 10; }
  .pdf-curr__head { padding: 4px 0 16px; margin-bottom: 6px; border-bottom: 2px solid var(--c-text); }
  .pdf-curr__org { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: #64748b; }
  .pdf-curr__title { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.02em; color: var(--c-text); }
  .pdf-curr__meta { margin: 6px 0 0; font-size: 14px; color: #475569; }

  /* ══════════════════════════════════════
     6. PAGE 1 — 학원 소개
  ══════════════════════════════════════ */

  /* 영상 배경 */
  .intro-bg-video {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .intro-bg-video.is-ready { opacity: 1; }
  .intro-bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.52) 0%,
      rgba(0,0,0,0.38) 50%,
      rgba(0,0,0,0.62) 100%
    );
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .intro-bg-overlay.is-ready { opacity: 1; }
  #page-intro .page__inner {
    position: relative;
    z-index: 3;
  }
  /* 인트로 페이지 텍스트 색상 → 흰색 계열로 */
  #page-intro .page-label          { color: rgba(255,255,255,0.6); }
  #page-intro .hero-title          { color: #fff; }
  #page-intro .hero-title em::after { opacity: 0.55; }
  #page-intro .hero-sub,
  #page-intro .hero-flow           { color: rgba(255,255,255,0.75); }
  #page-intro .flow-step           { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25); }
  #page-intro .flow-arr            { color: rgba(255,255,255,0.5); }
  #page-intro .feature-card__icon-wrap { background: rgba(255,255,255,0.2); }
  #page-intro .feature-card__desc  { color: rgba(255,255,255,0.78); }
  #page-intro .feature-card--featured .feature-card__icon-wrap { background: rgba(255,170,0,0.4); }
  #page-intro .stat-card           { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); color: #fff; }
  #page-intro .stat-num            { color: #fff; }
  #page-intro .stat-lbl            { color: rgba(255,255,255,0.7); }
  #page-intro .feature-grid        { --fg-bg: rgba(255,255,255,0.1); }
  #page-intro .feature-card        { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); color: #fff; }
  #page-intro .feature-card__title { color: #fff; }
  #page-intro .feature-card__desc  { color: rgba(255,255,255,0.75); }
  #page-intro .feature-card--featured { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
  #page-intro .section-mini-label  { color: rgba(255,255,255,0.5); }
  #page-intro .badge               { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.2); }
  #page-intro .portfolio-preview-card { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); color: #fff; }
  #page-intro .portfolio-preview-card__dept { color: #fff; }
  #page-intro .portfolio-preview-card__list li { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }

  .hero-title {
    font-size: var(--t-hero);
    font-weight: 800;
    letter-spacing: -.05em;
    line-height: 1.04;
    margin-bottom: 20px;
  }
  .hero-title em {
    font-style: normal;
    position: relative;
    display: inline-block;
  }
  .hero-title em::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    bottom: 2px;
    height: 6px;
    background: var(--c-course);
    border-radius: 3px;
    opacity: 0.35;
    transition: background var(--base);
  }
  .hero-sub {
    font-size: var(--t-lg);
    color: var(--c-text-2);
    margin-bottom: 48px;
    font-weight: 400;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 52px;
  }
  .stat-card {
    padding: 22px 20px;
    border: 1px solid var(--c-border);
    border-top: 3px solid #1E3461;
    border-radius: 14px;
    background: var(--c-bg-2);
  }
  .stat-num {
    display: block;
    font-size: var(--t-3xl);
    font-weight: 800;
    letter-spacing: -.045em;
    color: #1E3461;
    margin-bottom: 3px;
    line-height: 1;
  }
  .stat-lbl { font-size: var(--t-sm); color: var(--c-text-3); }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .feature-card {
    padding: 26px;
    border: 1px solid var(--c-border);
    border-radius: 18px;
    display: flex;
    gap: 18px;
    align-items: flex-start;
    transition: border-color var(--base), box-shadow var(--base);
    position: relative;
  }
  .feature-card:hover {
    border-color: var(--c-course);
    box-shadow: 0 0 0 1px var(--c-course);
  }
  .feature-card__icon-wrap {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--c-course-tint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
    transition: background var(--base);
  }
  .feature-card__title { font-size: var(--t-md); font-weight: 700; margin-bottom: 5px; letter-spacing: -.01em; }
  .feature-card__desc  { font-size: var(--t-sm); color: var(--c-text-2); line-height: 1.7; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge {
    padding: 7px 14px;
    background: #F1F5F9;
    border-radius: 99px;
    font-size: var(--t-sm);
    color: #374151;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .hero-flow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:48px; }
  .flow-step { padding:5px 13px; background:var(--c-bg-2); border:1px solid var(--c-border); border-radius:99px; font-size:var(--t-sm); font-weight:500; color:var(--c-text-2); }
  .flow-arr  { color:var(--c-text-3); font-size:.85rem; }
  .feature-card--featured {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #EEF2FF 0%, #F0FDF4 100%);
    border-color: transparent;
  }
  .feature-card--featured .feature-card__icon-wrap {
    width: 56px; height: 56px;
    background: #1E3461;
    color: #fff;
    font-size: 1.5rem;
    border-radius: 14px;
  }
  .section-mini-label { font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c-text-3); margin-top:32px; margin-bottom:10px; }

  /* ══ PORTFOLIO PREVIEW ══ */
  .portfolio-preview-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:8px; }
  .portfolio-preview-card { background:#F8FAFC; border:1px solid var(--c-border); border-radius:14px; padding:14px; text-align:center; }
  .portfolio-preview-card__emoji { font-size:1.6rem; margin-bottom:4px; }
  .portfolio-preview-card__dept { font-size:var(--t-sm); font-weight:700; color:var(--c-text-1); margin-bottom:6px; }
  .portfolio-preview-card__list { list-style:none; padding:0; margin:0; }
  .portfolio-preview-card__list li { font-size:11px; color:var(--c-text-2); padding:2px 0; border-top:1px solid var(--c-border); }
  .portfolio-preview-card__list li:first-child { border-top:none; }

  /* ══════════════════════════════════════
     7. SUB-NAV
  ══════════════════════════════════════ */
  .sub-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
    align-items: center;
  }
  .sub-nav::-webkit-scrollbar { display: none; }
  .sub-nav-wrap { position:relative; display:flex; align-items:center; gap:4px; margin-bottom:32px; }
  .sub-nav-wrap .sub-nav { flex:1; margin-bottom:0; }
  .sub-nav-arr { flex-shrink:0; width:44px; height:44px; border-radius:50%; background:var(--c-bg-2); border:1px solid var(--c-border); font-size:20px; color:var(--c-text-2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; line-height:1; transition:opacity .15s,background .15s; }
  .sub-nav-arr:disabled { opacity:.2; cursor:default; }
  .sub-nav-arr:not(:disabled):hover { background:var(--c-bg-3,#f0f0f0); }
  .sub-nav__btn {
    padding: 9px 18px;
    border-radius: 99px;
    font-size: var(--t-sm);
    font-weight: 500;
    color: var(--c-text-2);
    white-space: nowrap;
    min-height: 40px;
    display: flex;

  /* ══════════════════════════════════════

  ══════════════════════════════════════ */
  .course-view { display: none; }
  .course-view.is-active {
    display: block;
    animation: fadeUp 210ms var(--ease);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }

  }
  .course-card {
    border: 1px solid var(--c-border);
    border-top: 4px solid var(--c-course);

  .course-card__meta {

    align-items: center;
    justify-content: space-between;

  }
  .course-card__tag {

    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--c-course);
    transition: color var(--base);
  }
  .course-card__duration { font-size: var(--t-sm); color: var(--c-text-3); font-weight: 500; }
  .course-card__body {
    display: grid;

    gap: 28px;
    align-items: start;
  }
  .course-card__title {

    line-height: 1.18;

  .course-card__desc { font-size: var(--t-md); color: var(--c-text-2); line-height: 1.75; }
  .course-card__skills {
    background: var(--c-bg);
    border: 1px solid var(--c-border);
    border-radius: 14px;
    padding: 22px;
  }
  .course-card__skills-label {
    font-size: var(--t-xs);
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--c-text-3);
    margin-bottom: 14px;
  }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-tags li {
    padding: 6px 14px;
    border: 1.5px solid var(--c-course);
    border-radius: 99px;
    font-size: var(--t-xs);
    color: var(--c-course);
    font-weight: 600;
    transition: border-color var(--base), color var(--base);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* ══════════════════════════════════════
     9. CURRICULUM ACCORDION
  ══════════════════════════════════════ */
  .dept-intro { margin-bottom: 32px; }
  .dept-intro__text {
    font-size: var(--t-md);
    color: var(--c-text-2);
    line-height: 1.75;
    white-space: pre-line;
    margin-bottom: 18px;
    padding: 20px 22px;
    background: var(--c-bg-2);
    border-left: 3px solid var(--c-course);
    border-radius: 0 12px 12px 0;
  }
  .dept-intro__text:empty:not(:focus) { display: none; }
  .admin-edit .dept-intro__text:empty { display: block; min-height: 48px; }
  .admin-edit .dept-intro__text:empty::before { content: '학과 소개 텍스트를 여기에 입력하세요 (클릭해서 편집)'; color: var(--c-text-3); font-style: italic; font-size: var(--t-sm); }
  .admin-edit .dept-intro__text .admin-editable:empty::before { content: '학과 소개 텍스트를 여기에 입력하세요 (클릭해서 편집)'; color: var(--c-text-3); font-style: italic; font-size: var(--t-sm); }
  .admin-edit .dept-intro__text:has(.admin-editable:empty) { min-height: 48px; }
  .dept-intro__img {
    width: 100%;
    display: block;
    border-radius: 14px;
    object-fit: contain;
  }
  .dept-intro__img-wrap { position: relative; }

    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,.55); color: #fff;
    border: none; border-radius: 8px; padding: 5px 10px;
    font-size: .75rem; cursor: pointer;
  }
  .curr-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .curr-header__title { font-size: var(--t-2xl); font-weight: 800; letter-spacing: -.03em; }
  .curr-header__meta  { font-size: var(--t-sm); color: var(--c-text-3); text-align: right; line-height: 1.6; }

  .accordion { border-top: 1px solid var(--c-border); }

  /* Accordion head: wraps trigger + optional admin del button */
  .accordion__head {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--c-border);
  }
  .accordion__head .admin-del-btn { flex-shrink: 0; margin-right: 8px; }

  .accordion__trigger {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    text-align: left;
    min-height: 56px;
    transition: background var(--fast);
  }
  .accordion__trigger:active { background: var(--c-bg-2); }
  .accordion__num {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--c-border);
    font-size: var(--t-xs);
    font-weight: 700;
    color: var(--c-text-3);

    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background var(--base), border-color var(--base), color var(--base);
  }
  .accordion__trigger[aria-expanded="true"] .accordion__num {
    background: var(--c-course);
    border-color: var(--c-course);
    color: #fff;
  }
  .accordion__week { font-size: var(--t-sm); font-weight: 700; color: var(--c-text-3); min-width: 72px; flex-shrink: 0; }
  .accordion__topic { flex: 1; font-size: var(--t-md); font-weight: 500; letter-spacing: -.01em; }
  .accordion__chevron {
    width: 7px; height: 7px;
    border-right: 1.8px solid var(--c-text-3);
    border-bottom: 1.8px solid var(--c-text-3);
    transform: rotate(45deg);
    flex-shrink: 0;
    transition: transform 240ms var(--ease);
    margin-right: 4px;
  }
  .accordion__trigger[aria-expanded="true"] .accordion__chevron { transform: rotate(-135deg); }
  .accordion__body { max-height: 0; overflow: hidden; transition: max-height 320ms var(--ease); }
  .accordion__inner {
    border-left: 3px solid var(--c-course);
    margin-left: calc(28px + 14px);
    padding: 12px 0 20px 18px;
    transition: border-color var(--base);
  }
  .topic-list li {
    font-size: var(--t-sm);
    color: var(--c-text-2);
    line-height: 2.1;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .topic-list li::before { content: '—'; color: var(--c-text-3); flex-shrink: 0; }
  .item-detail { font-weight: 300; color: var(--c-text-3); }
  /* 계층형 커리큘럼 */
  .topic-list .curr-week-hd { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c-course); margin: 16px 0 4px; padding-top: 14px; border-top: 1px solid var(--c-border); line-height: 1.4; }
  .topic-list .curr-week-hd:first-child { margin-top: 0; border-top: none; padding-top: 0; }
  .topic-list .curr-week-hd::before { display: none; }
  .topic-list .curr-topic-hd { font-weight: 700; color: var(--c-text); line-height: 1.6; gap: 6px; }
  .topic-list .curr-topic-hd::before { display: none; }
  .topic-list .curr-sub-item { padding-left: 14px; line-height: 1.9; }
  .topic-list .curr-sub-item::before { content: '—'; color: var(--c-text-3); flex-shrink: 0; }
  .topic-list .curr-month-hd { font-size: 12px; font-weight: 800; color: var(--c-course); background: color-mix(in srgb, var(--c-course) 10%, transparent); border-radius: 6px; padding: 5px 10px; margin: 20px 0 4px; letter-spacing: .06em; }
  .topic-list .curr-month-hd:first-child { margin-top: 0; }
  .topic-list .curr-month-hd::before { display: none; }
  .curr-month-img-section { position: relative; margin: 12px 0 20px; border-radius: 12px; overflow: hidden; background: var(--c-bg-2); }
  .curr-month-img-section .curr-month-img { width: 100%; display: block; cursor: zoom-in; }
  .curr-month-img-del { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 6px; padding: 3px 8px; font-size: .7rem; cursor: pointer; display: none; }
  .curr-month-img-chg { position: absolute; top: 8px; right: 48px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 6px; padding: 3px 8px; font-size: .7rem; cursor: pointer; display: none; }
  .admin-edit .curr-month-img-del, .admin-edit .curr-month-img-chg { display: block; }
  .curr-month-img-empty { margin: 8px 0 16px; }
  .diff-stars { font-size: 11px; letter-spacing: 1.5px; flex-shrink: 0; margin-left: 6px; cursor: default; }
  .diff-stars .s-on { color: #F59E0B; }
  .diff-stars .s-off { color: var(--c-border); }
  .diff-stars.editable { cursor: pointer; }
  .logo-row { display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-left: 4px; }
  .logo-badge { display: inline-flex; align-items: center; gap: 2px; }
  .logo-badge img { width: 15px; height: 15px; filter: grayscale(1) opacity(0.55); }
  .logo-badge__text { font-size: 9px; background: var(--c-bg-2); border: 1px solid var(--c-border); border-radius: 3px; padding: 1px 4px; color: var(--c-text-3); }
  .logo-del-btn { font-size: 9px; background: none; border: none; color: var(--c-text-3); cursor: pointer; padding: 0 1px; line-height: 1; }
  .logo-add-btn { font-size: 10px; background: none; border: 1px dashed var(--c-border); border-radius: 4px; padding: 2px 6px; color: var(--c-text-3); cursor: pointer; white-space: nowrap; }
  .logo-popover { position: fixed; z-index: 300; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 12px; padding: 12px; width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .logo-popover input { width: 100%; box-sizing: border-box; border: 1px solid var(--c-border); border-radius: 6px; padding: 6px 8px; font-size: 12px; background: var(--c-bg-2); color: var(--c-text); outline: none; }
  .logo-popover-list { margin-top: 8px; max-height: 140px; overflow-y: auto; }
  .logo-popover-item { display: flex; align-items: center; gap: 8px; padding: 5px 4px; cursor: pointer; border-radius: 6px; font-size: 12px; color: var(--c-text); }
  .logo-popover-item:hover { background: var(--c-bg-2); }
  .logo-popover-item img { width: 14px; height: 14px; opacity: 0.7; }
  .prereq-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 0 10px calc(28px + 14px + 8px); }
  .prereq-label { font-size: 10px; color: var(--c-text-3); flex-shrink: 0; }
  .prereq-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 100px; background: var(--c-bg-2); border: 1px solid var(--c-border); font-size: 10px; color: var(--c-text-2); }
  .prereq-chip button { background: none; border: none; color: var(--c-text-3); cursor: pointer; padding: 0 0 0 2px; font-size: 10px; line-height: 1; }
  .logo-popover-item.is-selected { background: var(--c-bg-2); }
  .logo-popover-item.is-selected::after { content: '✓'; margin-left: auto; color: var(--c-course); font-size: 12px; font-weight: 700; }
  .logo-popover-close { width: 100%; margin-top: 8px; padding: 6px; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-bg-2); font-size: 12px; color: var(--c-text); cursor: pointer; }
  .drag-handle { cursor: grab; color: var(--c-border); padding: 0 8px 0 0; font-size: 16px; flex-shrink: 0; user-select: none; line-height: 1; }
  .drag-handle:active { cursor: grabbing; }
  /* 커리큘럼 ↔ 포트폴리오 서브탭 */
  .curr-view-tabs { display: flex; gap: 4px; padding: 0 16px 14px; }
  .curr-tab-btn { padding: 5px 16px; border-radius: 100px; border: 1px solid var(--c-border); font-size: 12px; font-weight: 600; background: none; color: var(--c-text-2); cursor: pointer; transition: background .15s, color .15s; }
  .curr-tab-btn.is-active { background: var(--c-course); color: #fff; border-color: var(--c-course); }
  .curr-tab-panel.is-hidden { display: none; }
  /* 포트폴리오 그리드 */

  .portfolio-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 4/3; background: var(--c-bg-2); cursor: pointer; }
  .portfolio-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; object-position: center center; max-height: 450px; }
  .portfolio-item:hover img { transform: scale(1.04); }

  .portfolio-del-btn { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .portfolio-add-btn { display: block; margin: 4px 16px 16px; width: calc(100% - 32px); padding: 12px; border: 1.5px dashed var(--c-border); border-radius: 10px; background: none; font-size: 13px; color: var(--c-text-3); cursor: pointer; text-align: center; }
  .portfolio-empty { text-align: center; color: var(--c-text-3); font-size: 13px; padding: 48px 0; grid-column: 1/-1; }
  .accordion.drag-over { border-top: 2px solid var(--c-course); }
  .accordion.is-dragging { opacity: 0.35; }

  .kedustore-banner { display:flex; align-items:center; gap:14px; padding:14px 18px; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:12px; text-decoration:none; margin-bottom:20px; color:inherit; }

  .checklist-books { margin-bottom:22px; }

  .checklist-books__grid { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .book-thumb { display:flex; flex-direction:column; align-items:center; gap:5px; text-decoration:none; width:68px; }

  .checklist-card__tag {
    display: inline-block;
    font-size: var(--t-xs);
    font-weight: 700;
    letter-spacing: .08em;

    color: var(--cl, var(--c-text-3));

  .checklist-card__title { font-size: var(--t-md); font-weight: 700; margin-bottom: 18px; letter-spacing: -.01em; }
  .checklist-card__list { display: flex; flex-direction: column; gap: 10px; }
  .checklist-card__list li {
    display: flex;
    align-items: flex-start;

    font-size: var(--t-sm);

  .check-icon {
    width: 20px; height: 20px;

    margin-top: 1px;
  }

  /* ══════════════════════════════════════
     11. FOCUS
  ══════════════════════════════════════ */
  :focus-visible { outline: 2px solid var(--c-course); outline-offset: 2px; border-radius: 4px; }

  /* ══════════════════════════════════════
     12. RESPONSIVE
  ══════════════════════════════════════ */
  @media (max-width: 680px) {
    :root { --t-hero: 3rem; --t-3xl: 1.8rem; --t-2xl: 1.4rem; }
    .page { padding: 28px 18px 48px; }
    .stat-row { grid-template-columns: 1fr; }
    .stat-num { color: #1E3461; }
    .feature-grid { grid-template-columns: 1fr; }
    .feature-card { padding: 18px; gap: 14px; }
    .course-card__body { grid-template-columns: 1fr; }
    .header { padding: 0 16px; gap: 14px; }
  }
  @media (min-width: 1100px) {
    :root { --t-hero: 5.5rem; }
    .feature-grid { grid-template-columns: repeat(4, 1fr); }
  }

  /* ══════════════════════════════════════
     13. ADMIN — 로그인 모달
  ══════════════════════════════════════ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .modal-box {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    width: min(360px, 90vw);
    box-shadow: 0 24px 64px rgba(0,0,0,0.18);
  }
  .modal-box h3 { font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 20px; }
  .modal-box input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--c-border);
    border-radius: 10px;
    font: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 150ms;
  }
  .modal-box input[type="password"]:focus { border-color: #3B82F6; }
  .modal-error { color: #EF4444; font-size: 0.78rem; margin-top: 8px; display: none; }
  .modal-btns { display: flex; gap: 8px; margin-top: 20px; }
  .modal-btn {
    flex: 1; padding: 12px;
    border-radius: 10px;
    font: inherit; font-size: 0.9rem; font-weight: 700;
    border: none; cursor: pointer;
    transition: background 150ms;
  }
  .modal-btn-cancel  { background: var(--c-bg-2); color: var(--c-text-2); }
  .modal-btn-cancel:hover { background: #e0e0de; }
  .modal-btn-confirm { background: #111; color: #fff; }
  .modal-btn-confirm:hover { background: #333; }


  /* ══════════════════════════════════════
     13b. 범용 편집 모달 필드
  ══════════════════════════════════════ */
  .edit-modal { width: min(500px, 93vw); max-height: 88vh; overflow-y: auto; }
  .edit-modal h3 { font-size: 1rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 18px; }
  .modal-field { margin-bottom: 13px; }
  .modal-field > label { display: block; font-size: 10.5px; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .modal-field input[type="text"],
  .modal-field textarea,
  .modal-field select {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--c-border);
    border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none;
    transition: border-color 150ms; font-family: inherit; color: var(--c-text);
  }
  .modal-field input[type="text"]:focus,
  .modal-field textarea:focus,
  .modal-field select:focus { border-color: #3B82F6; }
  .modal-field textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
  .field-hint { font-size: 11px; color: #9CA3AF; margin-top: 4px; }
  .file-drop-zone {
    border: 2px dashed #D1D5DB; border-radius: 10px;
    padding: 16px 12px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .file-drop-zone.drag-over { border-color: #3B82F6; background: #EFF6FF; }
  .file-drop-preview img { max-height: 80px; border-radius: 6px; margin: 0 auto 8px; display: block; object-fit: cover; }
  .file-drop-zone p { font-size: 12px; color: #6B7280; margin: 0 0 8px; }
  .file-drop-btn { font-size: 12px; padding: 5px 12px; border: 1px solid var(--c-border); border-radius: 6px; background: #fff; cursor: pointer; color: var(--c-text); }
  .file-drop-btn:hover { background: var(--c-bg-2); }

  /* ══ PHOTO CROP MODAL ══ */
  .crop-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:600; display:flex; align-items:center; justify-content:center; }
  .crop-box { background:#fff; border-radius:18px; width:320px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.3); }
  .crop-header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0; }
  .crop-header h4 { font-size:15px; font-weight:800; letter-spacing:-.02em; color:#111; margin:0; }
  .crop-header button { background:none; border:none; font-size:20px; color:#999; cursor:pointer; line-height:1; padding:0; }
  .crop-body { padding:16px 18px; }
  .crop-hint { font-size:11px; color:#9CA3AF; text-align:center; margin:0 0 10px; }
  .crop-viewport {
    width:240px; height:300px; overflow:hidden; position:relative;
    border-radius:10px; margin:0 auto; cursor:grab; touch-action:none;
    background:#222;
  }
  .crop-viewport:active { cursor:grabbing; }
  #crop-src-img {
    position:absolute; top:0; left:0;
    transform-origin:0 0; user-select:none; pointer-events:none;
    will-change:transform;
  }
  .crop-zoom-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .crop-zoom-row svg { flex-shrink:0; color:#9CA3AF; }
  #crop-zoom-slider { flex:1; accent-color:#1E3461; }
  .crop-preview-row { display:flex; align-items:center; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid #F3F4F6; }
  .crop-preview-label { font-size:11px; color:#9CA3AF; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
  #crop-preview-canvas { border-radius:6px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .crop-size-note { font-size:10px; color:#9CA3AF; }
  .crop-footer { display:flex; gap:8px; padding:0 18px 18px; }
  .crop-footer button { flex:1; padding:11px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
  .crop-cancel { background:#F3F4F6; border:none; color:#374151; }
  .crop-confirm { background:#1E3461; border:none; color:#fff; }
  /* ══════════════════════════════════════
     14. ROADMAP
  ══════════════════════════════════════ */
  .roadmap-steps { display: flex; flex-direction: column; gap: 0; margin-top: 24px; }
  .roadmap-step { display: flex; gap: 20px; position: relative; padding-bottom: 28px; }
  .roadmap-step:last-child { padding-bottom: 0; }
  .roadmap-step__line { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .roadmap-step__dot { width: 44px; height: 44px; border-radius: 50%; background: var(--c-course); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem; letter-spacing: .04em; }
  .roadmap-step__connector { width: 2px; flex: 1; background: var(--c-border); margin-top: 6px; min-height: 20px; }
  .roadmap-step:last-child .roadmap-step__connector { display: none; }
  .roadmap-step__body { padding-top: 10px; padding-left: 4px; flex: 1; }
  .roadmap-step__title { font-size: var(--t-lg); font-weight: 700; margin-bottom: 3px; }
  .roadmap-step__weeks { font-size: var(--t-sm); color: var(--c-course); font-weight: 600; margin-bottom: 6px; }
  .roadmap-step__desc { font-size: var(--t-sm); color: var(--c-text-2); line-height: 1.65; }
  .roadmap-step__purpose {
    margin-top: 8px; padding: 10px 14px;
    background: var(--c-bg-2); border-left: 3px solid var(--c-course);
    border-radius: 0 8px 8px 0; font-size: var(--t-sm); color: var(--c-text-2); line-height: 1.65;
  }
  .jobs-section { margin-top: 32px; }
  .jobs-section__label { font-size: var(--t-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c-text-3); margin-bottom: 10px; }
  .job-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .job-chip { padding: 6px 14px; border-radius: 99px; background: var(--c-course-tint); border: 1px solid var(--c-course); color: var(--c-course); font-size: var(--t-sm); font-weight: 600; position: relative; }
  .admin-edit .job-chip { padding-right: 26px; }
  .job-chip__del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--c-course); font-size: 12px; cursor: pointer; padding: 0; line-height: 1; }
  .outcomes-section { margin-top: 32px; padding: 20px 22px; background: var(--c-bg-2); border-radius: 16px; border: 1px solid var(--c-border); }
  .outcomes-section__label { font-size: var(--t-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c-text-3); margin-bottom: 12px; }
  .outcomes-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .outcomes-list li { display: flex; gap: 10px; font-size: var(--t-sm); color: var(--c-text); align-items: flex-start; line-height: 1.6; }
  .outcomes-list li .out-check { font-weight: 700; color: var(--c-course); flex-shrink: 0; }
  .inst-subject-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; align-items: center; }
  .inst-subject-chip { padding: 3px 10px; border-radius: 99px; background: var(--c-course-tint); color: var(--c-course); font-size: var(--t-xs); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .inst-subject-chip__del { background: none; border: none; color: var(--c-course); font-size: 11px; cursor: pointer; padding: 0; line-height: 1; }
  .curr-inline-img { list-style: none !important; padding: 0 !important; margin: 10px 0; }
  .curr-inline-img img { width: 100%; border-radius: 10px; cursor: zoom-in; display: block; }
  .curr-inline-img-btns { display: flex; gap: 5px; margin-top: 5px; }
  .curr-inline-img-btns button { padding: 3px 10px; border-radius: 6px; background: var(--c-bg-2); border: 1px solid var(--c-border); font-size: var(--t-xs); cursor: pointer; color: var(--c-text-2); transition: background .15s, color .15s; }
  .curr-inline-img-btns button:hover { background: var(--c-bg-3); color: var(--c-text); }

  /* ══════════════════════════════════════
     15. INSTRUCTORS
  ══════════════════════════════════════ */
  /* ══ 강사소개 PREMIUM ══ */
  .inst-section-hd { margin-bottom: 32px; border-bottom: 2px solid var(--c-text); padding-bottom: 16px; }
  .inst-section-label { font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--c-text-3); display: block; margin-bottom: 6px; }
  .inst-section-title { font-size: var(--t-2xl); font-weight: 900; letter-spacing: -0.04em; color: var(--c-text); line-height: 1; }

  .inst-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; }
  .inst-filter-btn { padding: 5px 14px; border-radius: 4px; border: 1.5px solid var(--c-border); background: var(--c-bg); font-size: var(--t-xs); font-weight: 600; color: var(--c-text-3); cursor: pointer; transition: all 130ms; letter-spacing: .02em; }
  .inst-filter-btn:hover { border-color: var(--c-text); color: var(--c-text); }
  .inst-filter-btn.is-active { background: var(--c-text); color: #fff; border-color: var(--c-text); }

  .instructor-grid { display: flex; flex-direction: column; gap: 0; margin-top: 0; }
  .instructor-card {
    display: grid;
    grid-template-columns: 44px 100px 1fr;
    gap: 0 22px;
    align-items: center;
    padding: 24px 0;
    border-bottom: 1px solid var(--c-border);
    background: transparent;
    border-radius: 0;
    position: relative;
    transition: background 120ms;
  }
  .instructor-card:first-of-type { border-top: 1px solid var(--c-border); }
  .instructor-card:hover { background: var(--c-bg-2); margin: 0 -16px; padding: 24px 16px; border-radius: 10px; border-color: transparent; }
  .instructor-num {
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--c-border);
    text-align: center;
    letter-spacing: -0.04em;
    user-select: none;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .instructor-avatar {
    position: relative;
    width: 96px;
    height: 120px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 900;
    color: rgba(255,255,255,0.9);
    flex-shrink: 0;
    overflow: hidden;
    letter-spacing: -0.04em;
    gap: 4px;
  }
  .instructor-avatar.is-m { background: #1E3461; }
  .instructor-avatar.is-f { background: #7C1D40; }
  .instructor-avatar.no-photo {
    background: var(--c-bg-2);
    border: 2px dashed var(--c-border);
    color: var(--c-text-3);
    font-size: 1.4rem;
  }
  .instructor-avatar img { width: 96px; height: 120px; object-fit: cover; object-position: center top; }
  .inst-no-photo-label { font-size: 10px; font-weight: 600; color: var(--c-text-3); letter-spacing: .04em; }
  .inst-photo-btn {
    position: absolute;
    bottom: 6px; right: 6px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #1E3461;
    color: #fff;
    border: 2px solid #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0; z-index: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .inst-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .inst-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
  .instructor-name { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0; line-height: 1.1; }
  .instructor-specialty { font-size: 10px; background: var(--c-course, #1E3461); color: #fff; font-weight: 700; display: inline-block; padding: 2px 8px; border-radius: 3px; border: none; letter-spacing: .04em; text-transform: uppercase; }
  .instructor-career { font-size: 11.5px; color: var(--c-text-3); line-height: 1.65; white-space: pre-line; margin-top: 2px; }

  /* ══════════════════════════════════════
     15b. EMPLOYMENT SECTION
  ══════════════════════════════════════ */
  .employment-section {
    background: linear-gradient(135deg, #1E3A5F 0%, #2563EB 100%);
    border-radius: 18px;
    padding: 22px 22px 18px;
    margin-bottom: 20px;
    color: #fff;
  }
  .employment-section__label {
    font-size: var(--t-md);
    font-weight: 800;
    margin-bottom: 4px;
  }
  .employment-section__sub {
    font-size: var(--t-sm);
    opacity: 0.8;
    margin-bottom: 14px;
  }
  .emp-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .emp-chip {
    display: inline-flex;
    flex-direction: column;
    gap: 1px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    padding: 6px 12px;
    backdrop-filter: blur(4px);
  }
  .emp-chip__co {
    font-size: var(--t-sm);
    font-weight: 700;
    color: #fff;
  }
  .emp-chip__dept {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
  }

  /* ══════════════════════════════════════
     16. REVIEWS v2
  ══════════════════════════════════════ */
  .review-banner { margin-bottom: 20px; }
  .review-banner__headline { font-size: var(--t-xl); font-weight: 800; letter-spacing: -.03em; line-height: 1.35; margin-bottom: 6px; }
  .review-banner__sub { font-size: var(--t-sm); color: var(--c-text-2); margin-bottom: 14px; }
  .review-banner__chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .review-banner__chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 100px; background: var(--c-bg-2); border: 1px solid var(--c-border); font-size: var(--t-sm); font-weight: 600; color: var(--c-text); }

  .review-grid-v2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .review-card-v2 {
    background: #fff; border: 1px solid var(--c-border); border-radius: 18px;
    padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px;
    position: relative; overflow: hidden;
    transition: box-shadow 220ms, transform 220ms;
  }
  .review-card-v2:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.09); transform: translateY(-2px); }
  .review-card-v2::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; background: var(--rv-accent, #3B82F6);
  }
  .review-card-v2__deco {
    position: absolute; top: 12px; right: 18px;
    font-size: 3.6rem; line-height: 1;
    color: var(--rv-accent, #3B82F6); opacity: .07;
    font-family: Georgia, serif; pointer-events: none; user-select: none;
  }
  .review-card-v2__head { display: flex; align-items: center; gap: 11px; }
  .review-avatar-v2 {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--rv-accent, #3B82F6); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: .85rem; font-weight: 800; flex-shrink: 0;
  }
  .review-card-v2__name { font-size: var(--t-sm); font-weight: 700; margin-bottom: 4px; }
  .review-card-v2__tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .rv-tag-course {
    font-size: 10px; font-weight: 600; color: var(--c-text-2);
    background: var(--c-bg-2); border: 1px solid var(--c-border);
    padding: 2px 7px; border-radius: 20px;
  }
  .rv-tag-pass {
    font-size: 10px; font-weight: 700; color: #15803d;
    background: #f0fdf4; border: 1px solid #86efac;
    padding: 2px 7px; border-radius: 20px;
  }
  .review-card-v2__video { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
  .review-card-v2__video iframe { width: 100%; height: 100%; border: 0; }
  .review-card-v2__text { font-size: var(--t-sm); color: var(--c-text); line-height: 1.82; flex: 1; }
  .review-card-v2__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .rv-stars { color: #FBBF24; font-size: .78rem; letter-spacing: 1.5px; }
  .rv-date  { font-size: 11px; color: var(--c-text-3); }

  .review-ghost {
    background: var(--c-bg-2); border: 1px dashed var(--c-border);
    border-radius: 18px; height: 110px; opacity: 0.45;
  }
  .review-more-label {
    grid-column: 1 / -1; text-align: center;
    padding: 4px 0 2px;
    font-size: var(--t-sm); color: var(--c-text-3);
    letter-spacing: .12em; font-weight: 500;
  }

  @media (max-width: 680px) { .review-grid-v2 { grid-template-columns: 1fr; } .review-ghost { display: none; } }
  @media (max-width: 1100px) and (orientation: landscape) { .main-nav__btn { padding: 7px 9px; } }   /* 메뉴 8개가 가로 태블릿에서 넘치지 않게 */
  .jobs-sub { font-size: var(--t-sm); color: var(--c-text-2); margin: -6px 0 18px; }
  .jobs-sec + .jobs-sec { margin-top: 34px; }
  .jobs-sec__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding-left: 12px; border-left: 4px solid var(--js); }
  .jobs-sec__title { font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em; color: var(--js); }
  .jobs-sec__sub { font-size: var(--t-xs); color: var(--c-text-3); }
  .jobs-empty { font-size: var(--t-sm); color: var(--c-text-3); padding: 24px 0; text-align: center; }
  .job-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .job-card { background: #fff; border: 1px solid var(--c-border); border-radius: 16px; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .job-card.is-closed { opacity: .55; }
  .job-card__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .job-card__co { font-size: var(--t-sm); font-weight: 700; color: var(--c-text-2); word-break: keep-all; }
  .job-card__title { font-size: 1.08rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.4; word-break: keep-all; }
  .job-card__meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; margin: 2px 0 0; padding: 12px 0 0; border-top: 1px solid var(--c-border); }
  .job-card__meta div { display: flex; gap: 8px; min-width: 0; }
  .job-card__meta dt { flex-shrink: 0; width: 56px; font-size: 12px; color: var(--c-text-3); }
  .job-card__meta dd { margin: 0; font-size: 13px; font-weight: 600; color: var(--c-text); word-break: keep-all; }
  .job-card__text { font-size: var(--t-sm); color: var(--c-text-2); line-height: 1.75; word-break: keep-all; }
  .job-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 4px; }
  .job-card__link { font-size: 13px; font-weight: 700; color: var(--c-accent); text-decoration: none; }
  .job-card__date { font-size: 11px; color: var(--c-text-3); }
  .job-card__admin { display: flex; gap: 6px; }
  .job-card__body { font-size: var(--t-sm); color: var(--c-text-2); line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
  .job-card__body.is-clamped { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .job-card__more { align-self: flex-start; padding: 0; border: 0; background: none; font-size: 13px; font-weight: 700; color: var(--c-accent); cursor: pointer; }
  .job-card__imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .job-card__imgs img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-bg-2); }
  .job-card__admin button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--c-border); background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  @media (max-width: 760px) { .job-grid { grid-template-columns: 1fr; } }
  @media (max-width: 420px) { .job-card__meta { grid-template-columns: 1fr; } }
  .g-rv { margin: 0 0 28px; }
  .g-rv:empty { display: none; }
  .g-rv__wait { font-size: var(--t-sm); color: var(--c-text-3); padding: 6px 0; }
  .g-rv__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .g-rv__title { font-size: var(--t-md); font-weight: 800; letter-spacing: -.02em; }
  .g-rv__score { display: inline-flex; align-items: baseline; gap: 8px; padding: 9px 14px; border-radius: 12px; border: 1px solid var(--c-border); background: #fff; color: var(--c-text); text-decoration: none; }
  .g-rv__score b { font-size: 1.05rem; font-weight: 800; color: #F59E0B; }
  .g-rv__score span { font-size: var(--t-xs); font-weight: 600; color: var(--c-text-2); }
  .g-rv__photo { object-fit: cover; background: var(--c-bg-2); }
  .g-rv__card .review-card-v2__name a { color: inherit; text-decoration: none; }
  .g-rv__text { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
  .g-rv__attr { margin-top: 8px; text-align: right; font-family: Roboto, Arial, sans-serif; font-size: 11px; color: #5e5e5e; }

  /* ══════════════════════════════════════
     17. IMAGE GALLERY & LIGHTBOX
  ══════════════════════════════════════ */
  .img-gallery { display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 16px; margin-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .img-gallery::-webkit-scrollbar { height: 3px; }
  .img-gallery::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }
  .img-gallery__item { flex-shrink: 0; width: 480px; aspect-ratio: 4/3; max-height: 360px; border-radius: 12px; overflow: hidden; cursor: pointer; position: relative; scroll-snap-align: start; border: 1px solid var(--c-border); }
  .img-gallery__item img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; object-position: center center; }
  .img-gallery__item:hover img { transform: scale(1.04); }
  .img-gallery__del { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: .7rem; display: flex; align-items: center; justify-content: center; }
  .img-gallery__add { flex-shrink: 0; width: 140px; aspect-ratio: 4/3; border-radius: 12px; border: 2px dashed var(--c-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--c-text-2); font-size: var(--t-sm); background: none; scroll-snap-align: start; }
  .img-gallery__add:hover { border-color: var(--c-text-2); }
  .img-pos-sel { position: absolute; bottom: 0; left: 0; right: 0; font-size: 10px; padding: 3px 6px; border: none; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 500; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 10px; pointer-events: none; }
  .lightbox__close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 2rem; background: none; border: none; cursor: pointer; line-height: 1; }

  @media (max-width: 680px) {
    .instructor-card { grid-template-columns: 36px 80px 1fr; gap: 0 14px; }
    .instructor-avatar { width: 76px; height: 96px; }
    .instructor-avatar img { width: 76px; height: 96px; }
    .review-grid { grid-template-columns: 1fr; }
  }

     18. ADMIN — 편집 바 + FAB
  ══════════════════════════════════════ */
  .admin-edit-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: #111; color: #fff; padding: 0 16px; height: 56px;
    display: flex; align-items: center; gap: 10px;

  }

  .aeb-btn { padding: 8px 16px; border-radius: 8px; font: inherit; font-size: 0.82rem; font-weight: 700; border: none; cursor: pointer; white-space: nowrap; transition: background 150ms; }
  .aeb-cancel { background: rgba(255,255,255,0.1); color: #fff; }

  .aeb-save { background: #22c55e; color: #fff; }

  .admin-fab__edit { padding: 9px 18px; background: #1E3461; color: #fff; border: none; border-radius: 24px; font-size: 0.82rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.25); white-space: nowrap; }
  .admin-fab__edit:hover { background: #2d4f8f; }
  .admin-fab__logout { padding: 5px 10px; background: rgba(0,0,0,0.45); color: rgba(255,255,255,0.55); border: none; border-radius: 12px; font-size: 0.7rem; cursor: pointer; }
  .admin-fab__logout:hover { color: #fff; }
  .app.is-admin .page { padding-bottom: 80px; }

  /* ══════════════════════════════════════
     15. ADMIN — 편집 모드
  ══════════════════════════════════════ */
  .admin-editable {
    display: inline;
    min-width: 8px;
  }

    outline: 1.5px dashed rgba(59,130,246,0.55);

  /* Delete button (inline ✕) */

    font-weight: 700;
