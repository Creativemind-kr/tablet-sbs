  const today = new Date(); today.setHours(0,0,0,0);
  const soon  = new Date(today); soon.setDate(today.getDate() + 60);

  const cats = [...new Set(EXAM_SCHEDULE.map(e => e.cat))];
  const tabs = cats.map((c, i) =>
    `<button class="exam-tab-btn ${i===0?'is-active':''}" onclick="switchExamCat(this,'${c}')">${c}</button>`
  ).join('');

  const groups = cats.map(cat => {
    const exams = EXAM_SCHEDULE.filter(e => e.cat === cat);
    let inner = '';
    if (cat === '국가기술자격') {
      const grades = [...new Set(exams.map(e => e.grade || '기능사'))];
      const gradeTabs = grades.map((g, i) =>
        `<button class="exam-grade-tab-btn ${i===0?'is-active':''}" onclick="switchExamGrade(this,'${g}')">${g}</button>`
      ).join('');
      const gradeGroups = grades.map((grade, i) => {
        const cards = _mergeSameSchedule(exams.filter(e => (e.grade || '기능사') === grade))
          .map(ex => _buildExamCard(ex, today, soon)).join('');
        return `<div class="exam-grade-group" data-grade="${grade}" style="${i===0?'':'display:none'}">${cards}</div>`;
      }).join('');
      inner = `<div class="exam-grade-tab-row">${gradeTabs}</div>${gradeGroups}`;
    } else {
      inner = _mergeSameSchedule(exams).map(ex => _buildExamCard(ex, today, soon)).join('');
    }
    return `<div class="exam-group" data-cat="${cat}" style="${cat===cats[0]?'':'display:none'}">${inner}</div>`;
  }).join('');

  document.getElementById('exams-content').innerHTML = `
    <div class="page-label-row">
      <p class="page-label">자격증 시험 일정</p>
      <a href="https://cbt-site-pearl.vercel.app/" target="_blank" rel="noopener" class="pretest-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        CBT 모의고사 체험하기
      </a>
    </div>
    <p class="exams-sub">SBS아카데미에서 준비할 수 있는 국가자격증 · 민간자격증 시험 일정입니다. D-Day는 오늘 기준 자동 계산됩니다.</p>
    ${buildExamDDayTable()}
    <div class="exam-tab-row">${tabs}</div>
    ${groups}`;
}

function switchExamCat(btn, cat) {
  const container = document.getElementById('exams-content');
  if (!container) return;
  container.querySelectorAll('.exam-tab-btn').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  container.querySelectorAll('.exam-group').forEach(g => {
    g.style.display = g.dataset.cat === cat ? 'block' : 'none';
  });
}

function switchExamGrade(btn, grade) {
  const group = btn.closest('.exam-group');
  if (!group) return;
  group.querySelectorAll('.exam-grade-tab-btn').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  group.querySelectorAll('.exam-grade-group').forEach(g => {
    g.style.display = g.dataset.grade === grade ? 'block' : 'none';
  });
}

/* ══════════════════════════════════════════════════
   RENDER: 커리큘럼 패널 (1개)
══════════════════════════════════════════════════ */
function imgUrl(src) { return typeof src === 'string' ? src : (src && src.url ? src.url : ''); }
function imgPos(src) { return typeof src === 'string' ? 'center center' : (src && src.position ? src.position : 'center center'); }
function renderCurriculumView(id) {
  const c  = COURSES[id];
  const em = isEditMode;

  let el = document.getElementById('cr-'+id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'cr-'+id;
    el.className = 'course-view';
    document.getElementById('curr-views').appendChild(el);
  }

  let trackedMonth = 0;
  const monthImgsData = c.monthImgs || {};
  const weekParts = (c.curriculum || []).map((item, wi) => {
    // 이 블록의 첫 번째 주차 번호로 달 계산
    const firstWeekNo = (item.items || [])
      .filter(x => x.startsWith('## '))
      .map(x => parseInt(x.match(/\d+/)?.[0] || 0))
      .find(n => n > 0) || 0;
    const blockMonth = firstWeekNo > 0 ? Math.ceil(firstWeekNo / 4) : 0;

    // 달이 바뀔 때 이전 달 이미지 섹션 주입
    let monthImgPrefix = '';
    if (blockMonth > 0 && blockMonth > trackedMonth && trackedMonth > 0) {
      const url = monthImgsData[trackedMonth];
      monthImgPrefix = url
        ? `<div class="curr-month-img-section"><img src="${url}" class="curr-month-img" onclick="openLightbox('${url}')"><button class="curr-month-img-chg" onclick="addMonthImg('${id}',${trackedMonth})">🖼 변경</button><button class="curr-month-img-del" onclick="deleteMonthImg('${id}',${trackedMonth})">✕</button></div>`
        : (em ? `<div class="curr-month-img-empty"><button class="admin-add-btn" onclick="addMonthImg('${id}',${trackedMonth})">+ ${trackedMonth}달차 이미지 추가</button></div>` : '');
    }
    if (blockMonth > 0) trackedMonth = blockMonth;

    // #4 Bold/Light: split at ' · ' + 계층형 마커 지원 (## Week, # Topic) + 월별 그룹
    const itemsList = item.items || [];
    const totalWeekCount = itemsList.filter(x => x.startsWith('## ')).length;
    const useMonthGroups = !em && totalWeekCount >= 5;
    let lastMonthNum = 0;
    const items = itemsList.map((it, ii) => {
      if (it.startsWith('@@img:')) {
        const imgUrl = it.slice(6);
        if (!em) return `<li class="curr-inline-img"><img src="${imgUrl}" onclick="openLightbox('${imgUrl}')"></li>`;
        return `<li class="curr-inline-img"><img src="${imgUrl}" onclick="openLightbox('${imgUrl}')"><div class="curr-inline-img-btns"><button onclick="moveCurrItem('${id}',${wi},${ii},-1)">↑ 위로</button><button onclick="moveCurrItem('${id}',${wi},${ii},1)">↓ 아래로</button><button class="admin-del-btn" onclick="deleteCurrItem('${id}',${wi},${ii})">✕ 삭제</button></div></li>`;
      }
      if (!em && it.startsWith('## ')) {
        const wm = it.match(/\d+/); const wn = wm ? parseInt(wm[0]) : 0;
        const mn = Math.ceil(wn / 4);
        let prefix = '';
        if (useMonthGroups && mn !== lastMonthNum) { lastMonthNum = mn; prefix = `<li class="curr-month-hd">${mn}달차</li>`; }
        return prefix + `<li class="curr-week-hd">${it.slice(3)}</li>`;
      }
      if (!em && it.startsWith('# ')) {
        return `<li class="curr-topic-hd">▸ ${it.slice(2)}</li>`;
      }
      const sepIdx = it.indexOf(' · ');
      const label  = sepIdx >= 0 ? it.slice(0, sepIdx) : it;
      const detail = sepIdx >= 0 ? it.slice(sepIdx) : '';
      const textHtml = em
        ? `<span class="admin-inline-row">${E('courses.'+id+'.curriculum.'+wi+'.items.'+ii, it)}<button class="admin-del-btn" onclick="deleteCurrItem('${id}',${wi},${ii})">✕</button></span>`
        : `<strong>${linkify(label)}</strong>${detail ? `<span class="item-detail">${linkify(detail)}</span>` : ''}`;
      const cls = (!em && itemsList.some(x => x.startsWith('## ') || x.startsWith('# '))) ? ' class="curr-sub-item"' : '';
      return `<li${cls}>${textHtml}</li>`;
    }).join('');

    // #3 Difficulty stars
    const diff = item.difficulty !== undefined ? item.difficulty : (DIFFICULTY_MAP[item.week] || 3);
    const starsHtml = Array.from({length: 5}, (_, i) =>
      `<span class="${i < diff ? 's-on' : 's-off'}">${i < diff ? '★' : '☆'}</span>`
    ).join('');
    const diffEl = em
      ? `<span class="diff-stars editable" title="난이도 ${diff}/5">${starsHtml}</span>`
      : `<span class="diff-stars" title="난이도 ${diff}/5">${starsHtml}</span>`;

    // #2 Logo row
    const logoSlugs = (item.logos && item.logos.length > 0) ? item.logos
      : (AUTO_LOGO_MAP[item.week] ? [AUTO_LOGO_MAP[item.week]] : []);
    const logoImgs = logoSlugs.map((slug, li) => {
      const delBtn = em ? `<button class="logo-del-btn" onclick="event.stopPropagation();removeLogo('${id}',${wi},${li})">✕</button>` : '';
      const preset = LOGO_PRESETS.find(p => p.slug === slug);
      const label  = preset?.label || preset?.name || slug;
      return `<span class="logo-badge"><img src="${logoUrl(slug)}" width="15" height="15" onerror="this.parentNode.innerHTML='<span class=logo-badge__text>${label}</span>'">${delBtn}</span>`;
    }).join('');
    const addLogoBtn = em ? `<button class="logo-add-btn" onclick="event.stopPropagation();openLogoPopover('${id}',${wi},this)">+ 로고</button>` : '';
    const logoRowEl = (logoImgs || addLogoBtn) ? `<span class="logo-row">${logoImgs}${addLogoBtn}</span>` : '';

    // 선수강과목
    const prereqs = item.prereqs || [];
    const prereqChips = prereqs.map((p, pi) =>
      `<span class="prereq-chip">${p}${em ? `<button onclick="removePrereq('${id}',${wi},${pi})">✕</button>` : ''}</span>`
    ).join('');
    const prereqRow = (prereqs.length > 0 || em) ? `
      <div class="prereq-row">
        <span class="prereq-label">선수강:</span>
        ${prereqChips}
        ${em ? `<button class="logo-add-btn" onclick="addPrereq('${id}',${wi})">+ 선수강 추가</button>` : ''}
      </div>` : '';

    const wImgs = (item.images || []);
    const wGalleryItems = wImgs.map((imgData, ii) => {
      const url = imgUrl(imgData), pos = imgPos(imgData);
      const posOpts = ['center center','center top','center bottom','left center','right center'];
      const posCtrl = em ? `<select class="img-pos-sel" onchange="event.stopPropagation();setCurrImgPos('${id}',${wi},${ii},this.value)" onclick="event.stopPropagation()">${posOpts.map(p=>`<option value="${p}"${pos===p?' selected':''}>${p}</option>`).join('')}</select>` : '';
      return `<div class="img-gallery__item" onclick="openLightbox('${url}')">
        <img src="${url}" alt="이미지 ${ii+1}" loading="lazy" style="object-position:${pos}">
        ${em ? `<button class="img-gallery__del" onclick="event.stopPropagation();deleteImage('${id}',${wi},${ii})">✕</button>` : ''}
        ${posCtrl}
      </div>`;
    }).join('');
    const wGallery = (wImgs.length > 0 || em) ? `
      <div class="img-gallery" style="margin-top:14px">
        ${wGalleryItems}
        ${em ? `<button class="img-gallery__add" onclick="addImage('${id}',${wi})">+ 이미지<br>추가</button>` : ''}
      </div>` : '';

    const accordionHtml = `
      <div class="accordion" ${em ? `draggable="true" data-cid="${id}" data-wi="${wi}"` : ''}>
        <div class="accordion__head">
          ${em ? `<span class="drag-handle" title="드래그로 순서 변경">⠿</span>` : ''}
          <button class="accordion__trigger" aria-expanded="false">
            <span class="accordion__num">${wi+1}</span>
            <span class="accordion__week">${em ? E('courses.'+id+'.curriculum.'+wi+'.week', item.week) : item.week}</span>
            ${logoRowEl}
            <span class="accordion__topic">${em ? E('courses.'+id+'.curriculum.'+wi+'.topic', item.topic) : item.topic}</span>
            ${diffEl}
            <span class="accordion__chevron" aria-hidden="true"></span>
          </button>
          ${em ? `<button class="admin-del-btn" onclick="deleteCurrWeek('${id}',${wi})" title="주차 삭제" style="margin-right:8px">✕</button>` : ''}
        </div>
        ${prereqRow}
        <div class="accordion__body">
          <div class="accordion__inner">
            <ul class="topic-list">${items}</ul>
            ${em ? `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="admin-add-btn" onclick="addCurrItem('${id}',${wi})">+ 항목 추가</button><button class="admin-add-btn" onclick="addInlineImage('${id}',${wi})">🖼 이미지 삽입</button></div>` : ''}
            ${wGallery}
          </div>
        </div>
      </div>`;
    return monthImgPrefix + accordionHtml;
  });

  // 마지막 달 이미지
  const lastMonthUrl = monthImgsData[trackedMonth];
  const lastMonthHtml = trackedMonth > 0 ? (
    lastMonthUrl
      ? `<div class="curr-month-img-section"><img src="${lastMonthUrl}" class="curr-month-img" onclick="openLightbox('${lastMonthUrl}')"><button class="curr-month-img-chg" onclick="addMonthImg('${id}',${trackedMonth})">🖼 변경</button><button class="curr-month-img-del" onclick="deleteMonthImg('${id}',${trackedMonth})">✕</button></div>`
      : (em ? `<div class="curr-month-img-empty"><button class="admin-add-btn" onclick="addMonthImg('${id}',${trackedMonth})">+ ${trackedMonth}달차 이미지 추가</button></div>` : '')
  ) : '';
  const weeks = weekParts.join('') + lastMonthHtml;

  // 재렌더 전에 활성 탭 기억
  const pfWasActive = document.getElementById('ct-pf-'+id)?.classList.contains('is-hidden') === false;

  if (!c.portfolio) c.portfolio = [];
  const portfolioItems = c.portfolio.map((entry, idx) => {
    const ytId = typeof entry === 'string' && entry.startsWith('youtube:') ? entry.slice(8) : null;
    if (ytId) {
      const embedSrc = `https://www.youtube.com/embed/${ytId}?loop=1&playlist=${ytId}&rel=0&modestbranding=1`;
      return `<div class="portfolio-item portfolio-item--video">
        <iframe src="${embedSrc}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
        ${em ? `<button class="portfolio-del-btn" onclick="event.stopPropagation();deletePortfolioImage('${id}',${idx})">✕</button>` : ''}
      </div>`;
    }
    const url = typeof entry === 'string' ? entry : entry.url;
    return `<div class="portfolio-item" onclick="openLightbox('${url}')">
      <img src="${url}" loading="lazy">
      ${em ? `<button class="portfolio-del-btn" onclick="event.stopPropagation();deletePortfolioImage('${id}',${idx})">✕</button>` : ''}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="curr-header">
      <h2 class="curr-header__title">${c.label}</h2>
      <div class="curr-header__meta">${c.duration}</div>
    </div>
    <div class="curr-view-tabs">
      <button class="curr-tab-btn${pfWasActive ? '' : ' is-active'}" onclick="switchCurrTab('${id}','curriculum')">커리큘럼</button>
      <button class="curr-tab-btn${pfWasActive ? ' is-active' : ''}" onclick="switchCurrTab('${id}','portfolio')">포트폴리오</button>
    </div>
    <div class="curr-tab-panel${pfWasActive ? ' is-hidden' : ''}" id="ct-curr-${id}">
      ${weeks}
      ${em ? `<button class="admin-add-block" onclick="addCurrWeek('${id}')">+ 주차 추가</button>` : ''}
    </div>
    <div class="curr-tab-panel${pfWasActive ? '' : ' is-hidden'}" id="ct-pf-${id}">
      <div class="portfolio-grid">${portfolioItems || '<p class="portfolio-empty">포트폴리오 이미지가 없습니다</p>'}</div>
      ${em ? `<div style="display:flex;gap:8px;margin:4px 16px 16px">
        <button class="portfolio-add-btn" style="margin:0;flex:1" onclick="uploadPortfolioImage('${id}')">+ 이미지 추가</button>
        <button class="portfolio-add-btn" style="margin:0;flex:1" onclick="addPortfolioVideo('${id}')">▶ 유튜브 추가</button>
      </div>` : ''}
    </div>
    ${((() => { const usingDO = !c.outcomes?.length; const outs = usingDO ? (DEFAULT_OUTCOMES[id]||[]) : c.outcomes; return (outs.length || em) ? `
    <div class="outcomes-section">
      <p class="outcomes-section__label">이 과정을 마치면${em && usingDO ? ' <span style="font-size:var(--t-xs);font-weight:400;color:var(--c-text-3)">(기본값)</span>' : ''}</p>
      <ul class="outcomes-list">
        ${outs.map((o,oi) => `<li><span class="out-check">✓</span>${em && !usingDO
          ? `<span class="admin-inline-row">${E('courses.'+id+'.outcomes.'+oi, o)}<button class="admin-del-btn" onclick="deleteOutcome('${id}',${oi})">✕</button></span>`
          : o}</li>`).join('')}
      </ul>
      ${em ? `<div style="margin-top:12px"><button class="admin-add-btn" onclick="addOutcome('${id}')">+ 항목 추가</button></div>` : ''}
    </div>` : ''; })())}`;
}

function renderChecklistCard(id) {
  const c  = COURSES[id];
  const em = isEditMode;
  const ck = PALETTE_KEYS.includes(c.colorKey) ? c.colorKey : 'web';

  let el = document.getElementById('cl-'+id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'cl-'+id;
    el.className = 'course-view';
    document.getElementById('checklist-views').appendChild(el);
  }

  const items = (c.checklist || []).map((item, ci) => `
    <li>
      <span class="check-icon">✓</span>
      ${em
        ? `<span class="admin-inline-row">${E('courses.'+id+'.checklist.'+ci, item)}<button class="admin-del-btn" onclick="deleteChecklistItem('${id}',${ci})">✕</button></span>`
        : linkify(item)
      }
    </li>`).join('');

  const dBooks = BOOKS_DATA[id] || [];
  const booksHtml = (dBooks.length || em) ? `
    <div class="checklist-books">
      <p class="checklist-books__label">필요 교재</p>
      <div class="checklist-books__grid">
        ${dBooks.map((b, bi) => em
          ? `<div class="book-admin-card">
               <img src="${b.img}" onerror="this.style.opacity='.3'" loading="lazy">
               <span style="font-size:9px;text-align:center;line-height:1.3;word-break:keep-all">${b.name}</span>
               <div style="display:flex;gap:3px;justify-content:center">
                 <button class="file-drop-btn" style="padding:2px 6px" onclick="editBook('${id}',${bi})">✏️</button>
                 <button class="admin-del-btn" onclick="deleteBook('${id}',${bi})">✕</button>
               </div>
             </div>`
          : `<a href="${b.link||'#'}" target="_blank" rel="noopener" class="book-thumb">
               <img src="${b.img}" alt="${b.name}" loading="lazy">
               <span>${b.name}</span>
             </a>`
        ).join('')}
      </div>
      ${em
        ? `<button class="admin-add-btn" onclick="addBook('${id}')">+ 교재 추가</button>`
        : dBooks.length ? `<a href="https://www.kedustore.com/books/list.asp#3" target="_blank" rel="noopener" class="kedustore-btn">🛒 교재 구매 바로가기</a>` : ''
      }
    </div>` : '';

  const supplyImgHtml = DEPT_SUPPLIES[id] ? `<img src="/images/supplies/${DEPT_SUPPLIES[id]}" class="supply-img" alt="${c.label} 준비물 안내">` : '';

  el.innerHTML = `
    <div class="curr-header">
      <h2 class="curr-header__title">${c.label}</h2>
      <div class="curr-header__meta">${c.duration}</div>
    </div>
    ${booksHtml}
    ${supplyImgHtml}
    <p class="checklist-intro" style="margin-bottom:20px">
      수강 등록 전 아래 준비물을 확인해 주세요.<br>
      장비 구매 전 반드시 상담을 먼저 받아보시길 권장합니다.
    </p>
    <div class="checklist-card" data-colorkey="${ck}">
      <ul class="checklist-card__list">${items || '<li style="color:var(--c-text-3)">준비물 항목을 추가하세요.</li>'}</ul>
      ${em ? `<div style="margin-top:12px"><button class="admin-add-btn" onclick="addChecklistItem('${id}')">+ 항목 추가</button></div>` : ''}
    </div>`;
}

function renderAll() {

    });

  document.querySelectorAll('#checklist-views > [id^="cl-"]').forEach(v => {
    const vid = v.id.replace('cl-', '');

  DEPT_ORDER.filter(id => COURSES[id]).forEach(id => {

    renderChecklistCard(id);
  });

function setCourseColor(courseId) {

/* ══════════════════════════════════════════════════
   COURSE PANEL ACTIVATION
══════════════════════════════════════════════════ */
function activateCoursePanels(courseId) {
  const ids = DEPT_ORDER;
  if (!COURSES[courseId]) courseId = ids[0];
  if (!courseId) return;

  document.querySelectorAll('.sub-nav__btn').forEach(b =>
    b.classList.toggle('is-active', b.dataset.course === courseId));
  setTimeout(() => {
    document.querySelectorAll('.sub-nav__btn.is-active').forEach(btn => {
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      const nav = btn.closest('.sub-nav');
      if (nav) updateSubNavArrows(nav.id);
    });
  }, 50);

  document.querySelectorAll('#roadmap-views > .course-view').forEach(v =>
    v.classList.toggle('is-active', v.id === 'rm-'+courseId));
  document.querySelectorAll('#curr-views > .course-view').forEach(v =>
    v.classList.toggle('is-active', v.id === 'cr-'+courseId));
  document.querySelectorAll('#checklist-views > .course-view').forEach(v =>
    v.classList.toggle('is-active', v.id === 'cl-'+courseId));

  setCourseColor(courseId);
  currentCourse = courseId;
}

/* ══════════════════════════════════════════════════
   PAGE SWITCHING
══════════════════════════════════════════════════ */
const PAGE_ORDER = ['intro','roadmap','curriculum','instructors','reviews','jobs','checklist','exams'];
// 화면 오른쪽 위 '3 / 7' 표시: 숨긴 메뉴(글이 없는 채용정보)는 세지 않음
function updateIndicator(pageId) {
  const vis = PAGE_ORDER.filter(p => { const b = document.querySelector(`.main-nav__btn[data-page="${p}"]`); return b && b.style.display !== 'none'; });
  const el = document.getElementById('indicator');
  if (el) el.textContent = `${Math.max(1, vis.indexOf(pageId) + 1)} / ${vis.length}`;
}

function goToPage(pageId) {
  if (pageId === currentPage) return;
  const outEl = document.getElementById('page-'+currentPage);
  const inEl  = document.getElementById('page-'+pageId);
  outEl.classList.add('exit');
  outEl.classList.remove('is-active');
  setTimeout(() => outEl.classList.remove('exit'), 200);
  inEl.classList.add('is-active');
  inEl.scrollTop = 0;
  document.querySelectorAll('.main-nav__btn').forEach(btn =>
    btn.classList.toggle('is-active', btn.dataset.page === pageId));
  updateIndicator(pageId);
  if (['intro','instructors','reviews','jobs'].includes(pageId)) setCourseColor(null);
  if (pageId === 'reviews') loadGoogleReviews();
  currentPage = pageId;
  // 영상 배경: 인트로일 때만 표시
  _syncBgVideo(pageId);
}

function _syncBgVideo(pageId) {
  const vid = document.querySelector('.intro-bg-video');
  const ovl = document.querySelector('.intro-bg-overlay');
  if (!vid || !ovl) return;
  if (pageId === 'intro') {
    vid.style.display = ''; ovl.style.display = '';
    vid.play && vid.play().catch(() => {});
  } else {
    vid.style.display = 'none'; ovl.style.display = 'none';
    vid.pause && vid.pause();
  }
}

/* ══════════════════════════════════════════════════
   GLOBAL EVENT DELEGATION
══════════════════════════════════════════════════ */
// Blur (capture) — editable field 반영
document.addEventListener('blur', e => {
  if (!isEditMode) return;
  const el = e.target;
  if (!el.dataset.path) return;
  setByPath(el.dataset.path, el.innerText.trim());
}, true);

// Click — main-nav / sub-nav / accordion
document.addEventListener('click', e => {
  // Main nav
  const mainBtn = e.target.closest('.main-nav__btn');
  if (mainBtn?.dataset.page) { goToPage(mainBtn.dataset.page); return; }

  // Sub-nav
  const subBtn = e.target.closest('.sub-nav__btn');
  if (subBtn?.dataset.course) { activateCoursePanels(subBtn.dataset.course); return; }

  // Difficulty star click (edit mode)
  const starEl = e.target.closest('.diff-stars.editable');
  if (starEl) {
    const trigger = starEl.closest('.accordion__trigger');
    const accordion = trigger?.closest('.accordion');
    const head = accordion?.closest('[data-curr-id]') || document.getElementById('curr-views');
    const stars = starEl.querySelectorAll('span');
    const idx = Array.from(stars).findIndex(s => s === e.target);
    if (idx >= 0) {
      // find id and wi from data attributes on the parent accordion
      const acc = starEl.closest('.accordion');
      const allAccordions = Array.from(acc?.closest('.course-view')?.querySelectorAll('.accordion') || []);
      const wi = allAccordions.indexOf(acc);
      const viewEl = acc?.closest('.course-view');
      const vid = viewEl?.id?.replace('cr-', '');
      if (vid && wi >= 0) setCurrDifficulty(vid, wi, idx + 1);
    }
    return;
  }

  // Accordion trigger (admin/logo/drag 버튼 제외)
  const trigger = e.target.closest('.accordion__trigger');
  if (trigger && !e.target.closest('.admin-del-btn') && !e.target.closest('.logo-add-btn') && !e.target.closest('.logo-del-btn') && !e.target.closest('.logo-row') && !e.target.closest('.drag-handle')) {
    const accordion = trigger.closest('.accordion');
    const body = accordion?.querySelector('.accordion__body');
    if (!body) return;
    const open = trigger.getAttribute('aria-expanded') === 'true';
    trigger.setAttribute('aria-expanded', String(!open));
    body.style.maxHeight = open ? '0' : body.scrollHeight + 'px';
  }
});

/* ══════════════════════════════════════════════════
   DRAG & DROP — 커리큘럼 순서 변경
══════════════════════════════════════════════════ */
document.addEventListener('dragstart', e => {
  const acc = e.target.closest('.accordion[draggable="true"]');
  if (!acc) return;
  _dragCid = acc.dataset.cid;
  _dragWi  = +acc.dataset.wi;
  acc.classList.add('is-dragging');
  e.dataTransfer.effectAllowed = 'move';
});

document.addEventListener('dragover', e => {
  const acc = e.target.closest('.accordion[draggable="true"]');
  if (!acc || acc.dataset.cid !== _dragCid) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.accordion.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (+acc.dataset.wi !== _dragWi) acc.classList.add('drag-over');
});

document.addEventListener('dragleave', e => {
  const acc = e.target.closest('.accordion');
  if (acc && !acc.contains(e.relatedTarget)) acc.classList.remove('drag-over');
});

document.addEventListener('drop', e => {
  const acc = e.target.closest('.accordion[draggable="true"]');
  if (!acc || _dragCid === null) return;
  e.preventDefault();
  const targetWi = +acc.dataset.wi;
  if (targetWi === _dragWi) return;
  const cur = COURSES[_dragCid].curriculum;
  const [moved] = cur.splice(_dragWi, 1);
  cur.splice(targetWi, 0, moved);
  renderCurriculumView(_dragCid);
  if (currentCourse === _dragCid) document.getElementById('cr-'+_dragCid)?.classList.add('is-active');
  _dragCid = null; _dragWi = null;
});

document.addEventListener('dragend', () => {
  document.querySelectorAll('.accordion.is-dragging, .accordion.drag-over')
    .forEach(el => el.classList.remove('is-dragging', 'drag-over'));
  _dragCid = null; _dragWi = null;
});

/* ══════════════════════════════════════════════════
   DRAG: 학과 탭 순서 변경 (서브네비)
══════════════════════════════════════════════════ */
let _dragDept = null;

document.addEventListener('dragstart', e => {
  const btn = e.target.closest('.sub-nav__btn[data-dept]');
  if (!btn) return;
  _dragDept = btn.dataset.dept;
  btn.classList.add('dept-is-dragging');
  e.dataTransfer.effectAllowed = 'move';
});

document.addEventListener('dragover', e => {
  if (!_dragDept) return;
  const btn = e.target.closest('.sub-nav__btn[data-dept]');
  if (btn) e.preventDefault();
});

document.addEventListener('drop', e => {
  if (!_dragDept) return;
  const btn = e.target.closest('.sub-nav__btn[data-dept]');
  if (!btn || btn.dataset.dept === _dragDept) { _dragDept = null; return; }
  e.preventDefault();
  const fromIdx = DEPT_ORDER.indexOf(_dragDept);
  const toIdx   = DEPT_ORDER.indexOf(btn.dataset.dept);
  DEPT_ORDER.splice(fromIdx, 1);
  DEPT_ORDER.splice(toIdx, 0, _dragDept);
  const saved = _dragDept;
  _dragDept = null;
  renderSubNavs();
  renderAll();
  if (currentCourse) activateCoursePanels(currentCourse);
  else if (saved && COURSES[saved]) activateCoursePanels(saved);
});

document.addEventListener('dragend', e => {
  document.querySelectorAll('.sub-nav__btn.dept-is-dragging')
    .forEach(b => b.classList.remove('dept-is-dragging'));
  _dragDept = null;
});

function addCourse() {
  const name = prompt('새 강좌 이름:');
  if (!name?.trim()) return;
  const key = 'c' + Date.now();
  const _usedColors = Object.values(COURSES).map(c => c.colorKey);
  const _colorKey = PALETTE_KEYS.find(k => !_usedColors.includes(k))
    || PALETTE_KEYS[Object.keys(COURSES).length % PALETTE_KEYS.length];
  COURSES[key] = {
    colorKey:   _colorKey,
    label:      name.trim(),
    duration:   '8주 과정 · 주 3회',
    title:      name.trim(),
    desc:       '강좌 설명을 입력하세요.',
    tags:       ['태그 입력'],
    roadmap:    [{ phase: '01', title: '기초 입문', weeks: '1–4주차', desc: '설명을 입력하세요' }],
    images:     [],
    curriculum: [{ week: '1–2주차', topic: '주제 입력', items: ['세부 항목 입력'] }],
    checklist:  ['준비물을 입력하세요']
  };
  DEPT_ORDER.push(key);
  renderAll();
  activateCoursePanels(key);
}
function deleteCourse(id) {
  openDeleteConfirm(`'${COURSES[id].label}' 강좌를 삭제하시겠습니까?`, () => {
    delete COURSES[id];
    DEPT_ORDER = DEPT_ORDER.filter(k => k !== id);

function addCourseTag(id) {

function deleteCourseTag(id, idx) {

  renderCurriculumView(id);
  if (currentCourse === id) document.getElementById('cr-'+id)?.classList.add('is-active');

function moveCurrItem(id, wi, ii, dir) {
  const items = COURSES[id].curriculum[wi].items;
  const ni = ii + dir;
  if (ni < 0 || ni >= items.length) return;
  [items[ii], items[ni]] = [items[ni], items[ii]];
  renderCurriculumView(id);
  if (currentCourse === id) document.getElementById('cr-'+id)?.classList.add('is-active');

async function addInlineImage(id, wi) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    showToast('이미지 처리 중...');
    try {
      const url = await uploadToStorage(file, 'curriculum');
      COURSES[id].curriculum[wi].items.push('@@img:' + url);
      renderCurriculumView(id);
      if (currentCourse === id) document.getElementById('cr-'+id)?.classList.add('is-active');

}

/* ══════════════════════════════════════════════════
   LOGO POPOVER — 로고 검색/추가/삭제
══════════════════════════════════════════════════ */
function closeLogoPopover() {
  if (_activeLogoPopover) { _activeLogoPopover.remove(); _activeLogoPopover = null; }
}
function openLogoPopover(id, wi, btn) {
  closeLogoPopover();
  const rect = btn.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'logo-popover';
  pop.style.top  = (rect.bottom + 6) + 'px';
  pop.style.left = Math.min(rect.left, window.innerWidth - 216) + 'px';
  pop.innerHTML = `
    <input type="text" placeholder="소프트웨어 검색..." oninput="filterLogoPopover(this, '${id}', ${wi})">
    <div class="logo-popover-list" id="lp-list-${id}-${wi}"></div>
    <button class="logo-popover-close" onclick="closeLogoPopover()">완료</button>`;
  document.body.appendChild(pop);
  _activeLogoPopover = pop;
  filterLogoPopover(pop.querySelector('input'), id, wi);
  setTimeout(() => document.addEventListener('click', function _close(e) {
    if (!pop.contains(e.target) && !e.target.closest('.logo-add-btn')) {
      closeLogoPopover(); document.removeEventListener('click', _close);
    }
  }), 50);
}
function filterLogoPopover(input, id, wi) {
  const q        = input.value.toLowerCase();
  const list     = document.getElementById(`lp-list-${id}-${wi}`);
  if (!list) return;
  const selected = COURSES[id]?.curriculum[wi]?.logos || [];
  const filtered = q ? LOGO_PRESETS.filter(p => p.name.toLowerCase().includes(q)) : LOGO_PRESETS;
  list.innerHTML = filtered.map(p => {
    const isSel = selected.includes(p.slug);
    return `<div class="logo-popover-item${isSel ? ' is-selected' : ''}" onclick="toggleLogo('${id}',${wi},'${p.slug}',this)">
      <img src="${logoUrl(p.slug)}" style="filter:grayscale(1)opacity(.6)" onerror="this.style.display='none'" width="14" height="14">
      ${p.name}
    </div>`;
  }).join('');
}
function toggleLogo(id, wi, slug, el) {
  if (!COURSES[id].curriculum[wi].logos) COURSES[id].curriculum[wi].logos = [];
  const logos = COURSES[id].curriculum[wi].logos;
  const idx = logos.indexOf(slug);
  if (idx >= 0) {
    logos.splice(idx, 1);
    el.classList.remove('is-selected');
  } else {
    logos.push(slug);
    el.classList.add('is-selected');
  }
  renderCurriculumView(id);
  if (currentCourse === id) document.getElementById('cr-'+id)?.classList.add('is-active');
  // 팝오버는 닫지 않음 — 다중선택 가능
}
function addLogo(id, wi, slug) {
  if (!COURSES[id].curriculum[wi].logos) COURSES[id].curriculum[wi].logos = [];
  if (!COURSES[id].curriculum[wi].logos.includes(slug)) {
    COURSES[id].curriculum[wi].logos.push(slug);
    renderCurriculumView(id);
    if (currentCourse === id) document.getElementById('cr-'+id)?.classList.add('is-active');
  }
}
function removeLogo(id, wi, li) {
  if (!COURSES[id].curriculum[wi].logos) return;
  COURSES[id].curriculum[wi].logos.splice(li, 1);
  renderCurriculumView(id);
  if (currentCourse === id) document.getElementById('cr-'+id)?.classList.add('is-active');
}

function addPrereq(id, wi) {

const JOB_FIELDS = [
  { key: 'company',  label: '회사명',          type: 'text', placeholder: '예: (주)OO디자인' },
  { key: 'title',    label: '모집 분야',        type: 'text', placeholder: '예: 웹디자이너 (신입·경력)' },

  { key: 'type',     label: '고용 형태',        type: 'text', placeholder: '예: 정규직 (수습 3개월)' },
  { key: 'pay',      label: '급여 (선택)',      type: 'text', placeholder: '예: 연 2,800만 원 · 면접 후 협의' },
  { key: 'deadline', label: '마감일',          type: 'text', placeholder: '예: 2026-12-31 또는 상시',
    hint: '날짜를 넣으면 마감일이 지난 뒤 상담 화면에서 자동으로 숨겨져요' },
  { key: 'text',     label: '상세 내용 (선택)', type: 'textarea', rows: 5 },

function jobDeadline(j) {
  const raw = String(j.deadline || '').trim();
  const m = raw.match(/(\d{2,4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
  if (!m) return { open: true, diff: Infinity, label: raw || '상시', cls: 'dday-always' };
  const y = +m[1] < 100 ? 2000 + +m[1] : +m[1];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(y, +m[2] - 1, +m[3]) - today) / 86400000);
  if (diff < 0) return { open: false, diff, label: '마감', cls: 'dday-done' };
  return { open: true, diff, label: diff === 0 ? '오늘 마감' : `D-${diff}`, cls: diff <= 7 ? 'dday-hot' : diff <= 30 ? 'dday-soon' : 'dday-ok' };
}
function kegPostParts(html) {
  const NL = String.fromCharCode(10);
  const doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  doc.querySelectorAll('br').forEach(b => b.replaceWith(NL));
  doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,h5,h6').forEach(e => e.append(NL));
  doc.querySelectorAll('td,th').forEach(e => e.append(' '));
  const imgs = [...doc.querySelectorAll('img')].map(i => i.getAttribute('src') || '').filter(u => /^https:\/\//.test(u)).slice(0, 6);
  const lines = (doc.body.textContent || '').replace(/ /g, ' ').split(NL).map(l => l.trim());
  const text = lines.join(NL).replace(/\n{3,}/g, NL + NL).trim();
  return { text, imgs };
}
// 그룹웨어 글은 등록일로부터 2개월이 지나면 숨김
function kegVisible() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return KEG_JOBS.filter(p => {
    const m = String(p.date || '').match(/^(\d{4})-(\d{2})-(\d{2})/);

function renderJobsPage() {

      ${imgs.length ? `<div class="job-card__imgs">${imgs.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>`).join('')}</div>` : ''}

<script>
/* ══════════════════════════════════════════════════
   학과별 로드맵 — 2호선 노선도: 화면에 맞춰 보여주기 + 누르면 노선 상세
══════════════════════════════════════════════════ */
(function () {
  const wrap  = document.getElementById('rmap');        // 노선도 판 + 상세 + 버튼
  const frame = document.getElementById('rmap-view');   // 전체 노선도 영역
  const stage = document.getElementById('rmap-stage');
  if (!wrap || !frame || !stage) return;
  const W = RMAP_W, H = RMAP_H;   // 노선도 판 크기(renderRoadmapMap 과 같은 값)
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const fw = () => frame.clientWidth, fh = () => frame.clientHeight;
  // 화면에 맞춰 가운데에(크게 보기·확대 없음)
  function fit() {
    if (!fw() || !fh()) return;
    const s = Math.min(fw() / W, fh() / H);
    stage.style.transform = `translate(${(fw() - W * s) / 2}px,${(fh() - H * s) / 2}px) scale(${s})`;
  }
  // 노선·순환선 누르면 상세 / 상세: 뒤로, 학과 커리큘럼 바로가기
  wrap.addEventListener('click', e => {
    if (e.target.closest('[contenteditable="true"]')) return;   // 편집 모드: 글씨 누르면 고치기
    const ln = e.target.closest('[data-line]');
    if (ln) { openRoadmapLine(ln.dataset.line); return; }
    if (e.target.closest('.rmd__back')) { closeRoadmapLine(); return; }
    const go = e.target.closest('.rmd__go');
    if (go) {
      goToPage('curriculum');
      activateCoursePanels(go.dataset.dept);
    }
  });
  wrap.addEventListener('keydown', e => {
    const ln = e.target.closest && e.target.closest('[data-line]');
    if (ln && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openRoadmapLine(ln.dataset.line); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || (e.target.closest && e.target.closest('[contenteditable="true"]'))) return;
    if (rmapOpen) closeRoadmapLine();
  });
  new ResizeObserver(fit).observe(frame);
  fit();
})();
</script>
<script>
/* ══════════════════════════════════════════════════
   PDF 받기 — 태블릿에 QR을 띄우고, 학생이 휴대폰으로 찍으면 그 휴대폰에서 PDF를 만들어 저장·공유
   - QR 주소: /?pdf=학과id · /?pdf=line-노선id · /?pdf=roadmap (태블릿에서 바로 저장도 가능)
   - 커리큘럼: 그 학과 커리큘럼(주차까지 펼침) + 포트폴리오
   - 로드맵: 노선 상세를 보고 있으면 그 노선 한 장, 전체 노선도면 노선도 한 장
   - 화면을 그림으로 떠서 A4에 넣음(html2canvas + jsPDF, 누를 때만 불러옴)
   - 주차별 사진은 PDF에서 빠짐. 포트폴리오는 /_vercel/image 로 줄여 받음(vercel.json 허용 목록)
══════════════════════════════════════════════════ */
(function () {
  const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
  const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  const ORG = 'SBS아카데미컴퓨터AIX학원';
  let libs = null, qrLib = null, busy = false;
  const addScript = src => new Promise((ok, no) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => { s.remove(); no(new Error('PDF 도구를 불러오지 못했어요(인터넷 연결 확인)')); };
    document.head.appendChild(s);
  });
  const loadLibs = () => libs || (libs = Promise.all(LIBS.map(addScript)).catch(e => { libs = null; throw e; }));
  const loadQr = () => qrLib || (qrLib = addScript(QR_LIB).catch(e => { qrLib = null; throw e; }));

  // 진행·완료 창
  function sheet() {
    let el = document.getElementById('pdfx');
    if (!el) {
      el = document.createElement('div'); el.id = 'pdfx'; el.className = 'pdfx'; el.hidden = true;
      el.innerHTML = '<div class="pdfx__box" role="dialog" aria-modal="true"><div class="pdfx__spin"></div><p class="pdfx__title"></p><p class="pdfx__sub"></p><div class="pdfx__qr"></div><div class="pdfx__btns"></div></div>';
      document.body.appendChild(el);
    }
    return el;
  }
  function show(title, sub, btns, spin) {
    const el = sheet();
    el.querySelector('.pdfx__title').textContent = title;
    el.querySelector('.pdfx__sub').textContent = sub || '';
    el.querySelector('.pdfx__spin').style.display = spin ? '' : 'none';
    el.querySelector('.pdfx__qr').innerHTML = '';
    const b = el.querySelector('.pdfx__btns'); b.innerHTML = '';
    (btns || []).forEach(([label, fn, main]) => {
      const x = document.createElement('button'); x.type = 'button'; x.className = 'pdfx__btn' + (main ? ' pdfx__btn--main' : '');
      x.textContent = label; x.onclick = fn; b.appendChild(x);
    });
    el.hidden = false;
  }
  const hide = () => { sheet().hidden = true; };

  // 화면 밖 1180×820 칸(iframe)에 그려서 그림으로 뜨기
  // → 태블릿·휴대폰 어디서 만들어도 PDF 모양이 같고, 사이트 전체를 복제하지 않아 빠름
  const STAGE_W = 1180, STAGE_H = 820;
  let stageP = null, stageEl = null;
  function stage() {
    if (stageP) return stageP;
    stageEl = document.createElement('iframe');
    stageEl.setAttribute('aria-hidden', 'true'); stageEl.tabIndex = -1;
    stageEl.style.cssText = `position:fixed;left:-30000px;top:0;width:${STAGE_W}px;height:${STAGE_H}px;border:0`;
    document.body.appendChild(stageEl);
    const d = stageEl.contentDocument;
    const css = [...document.querySelectorAll('head style, head link[rel="stylesheet"]')].map(n => n.outerHTML).join('');
    d.open();
    d.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="${location.origin}/">${css}</head><body></body></html>`);
    d.close();
    const links = [...d.querySelectorAll('link[rel="stylesheet"]')];
    stageP = Promise.all(links.map(l => l.sheet ? 0 : new Promise(r => { l.onload = l.onerror = r; setTimeout(r, 6000); })))
      .then(() => d.fonts.ready).then(() => d);
    return stageP;
  }
  function dropStage() { if (stageEl) stageEl.remove(); stageEl = null; stageP = null; }
  async function host(width, cls) {
    const d = await stage();
    const h = d.createElement('div'); h.className = 'pdf-host' + (cls ? ' ' + cls : '');
    h.style.width = width + 'px'; d.body.appendChild(h); return h;
  }
  const imgsReady = el => Promise.all([...el.querySelectorAll('img')].map(i =>
    i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; setTimeout(r, 8000); })));
  const sameOrigin = img => { try { return new URL(img.src, location.href).origin === location.origin; } catch (_) { return false; } };
  // PDF 도구가 못 읽는 최신 색 표기(color-mix → color(srgb …))를 rgba 로 바꿔 둠
  const COLOR_PROPS = ['color', 'backgroundColor', 'borderTopColor', 'borderRightColor', 'borderBottomColor', 'borderLeftColor', 'outlineColor'];
  const toRgba = v => v.replace(/color\(srgb ([\d.]+) ([\d.]+) ([\d.]+)(?: \/ ([\d.]+))?\)/g,
    (_, r, g, b, a) => `rgba(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)},${a == null ? 1 : a})`);
  function fixColors(root) {
    const view = root.ownerDocument.defaultView;
    [root, ...root.querySelectorAll('*')].forEach(el => {
      const cs = view.getComputedStyle(el);
      COLOR_PROPS.forEach(p => { const v = cs[p]; if (v && v.includes('color(')) el.style[p] = toRgba(v); });
    });
  }
  const shot = (el, scale) => window.html2canvas(el, {
    scale, backgroundColor: '#ffffff', useCORS: true, logging: false,
    ignoreElements: n => n.tagName === 'IMG' && !sameOrigin(n),
    onclone: (_, clone) => fontsFor(clone),   // 복제본도 글꼴을 다 받은 뒤 글자 위치를 잼
  });
  // 이 칸에 쓰인 글꼴을 먼저 불러옴(휴대폰은 노선도 화면을 안 거쳐 글꼴이 아직 없음)
  async function fontsFor(h) {
    const d = h.ownerDocument, view = d.defaultView, need = new Map();
    h.querySelectorAll('*').forEach(el => {
      const own = [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.nodeValue).join('').trim();
      if (!own) return;
      const cs = view.getComputedStyle(el), f = `${cs.fontStyle} ${cs.fontWeight} 16px ${cs.fontFamily}`;
      need.set(f, (need.get(f) || '') + own);
    });
    // 글자를 재는 곳(복제본)과 실제로 그리는 곳(메인 문서의 캔버스) 양쪽에 다 불러옴
    await Promise.all([...need].flatMap(([f, t]) => {
      const chars = [...new Set(t)].join('');
      return [d.fonts.load(f, chars).catch(() => {}), document.fonts.load(f, chars).catch(() => {})];
    }));
    await d.fonts.ready;
  }

  async function overview() {
    const st = document.getElementById('rmap-stage').cloneNode(true);
    st.removeAttribute('id'); st.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    st.style.cssText = `position:relative;transform:none;width:${RMAP_W}px;height:${RMAP_H}px`;
    const h = await host(RMAP_W); h.appendChild(st);
    try { await fontsFor(h); return await shot(h, 1.6); } finally { h.remove(); }
  }
  async function detail(id) {
    const h = await host(1400);
    h.innerHTML = `<div style="padding:8px 0">${rmDetailHtml(id, true)}</div>`;
    await imgsReady(h);
    try { await fontsFor(h); return await shot(h, 1.4); } finally { h.remove(); }
  }
  async function curriculum(id, add) {
    const c = COURSES[id], src = document.getElementById('cr-' + id);
    if (!c || !src) return;
    const h = await host(820, 'pdf-curr');
    const head = h.ownerDocument.createElement('div'); head.className = 'pdf-curr__head';
    const meta = src.querySelector('.curr-header__meta')?.textContent.trim() || '';
    head.innerHTML = `<p class="pdf-curr__org">${rmEsc(ORG)}</p><p class="pdf-curr__title">${rmEsc(c.label || '')} 커리큘럼</p>`
      + (meta ? `<p class="pdf-curr__meta">${rmEsc(meta)}</p>` : '');
    h.appendChild(head);
    const blocks = [head], inert = document.implementation.createHTMLDocument('');
    src.querySelectorAll('.curr-tab-panel:not([id^="ct-pf"]) > .accordion, .outcomes-section').forEach(n => {
      // 주차별 사진은 PDF에 안 들어가므로, 내려받기가 시작되지 않는 빈 문서에서 복제해 먼저 뺌
      const k = inert.importNode(n, true);
      k.querySelectorAll('.img-gallery, .curr-inline-img, .curr-month-img-section, .curr-month-img-empty').forEach(x => x.remove());
      h.appendChild(k); blocks.push(k);
    });
    h.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    fixColors(h);
    await imgsReady(h);
    try {
      await fontsFor(h);
      for (const b of blocks) add.flow(await shot(b, 1.7));
    } finally { h.remove(); }
  }

  // 포트폴리오: 원본(학과당 최대 70MB) 대신 서버에서 줄인 사진을 받아 A4에 2열로
  const pfUrl = u => `/_vercel/image?url=${encodeURIComponent(u)}&w=960&q=72`;
  function pfEntries(c) {
    return (c?.portfolio || []).map(e => {
      const raw = typeof e === 'string' ? e : e?.url;
      if (!raw) return null;
      if (raw.startsWith('youtube:')) {
        const v = raw.slice(8);
        return { src: pfUrl(`https://i.ytimg.com/vi/${encodeURIComponent(v)}/hqdefault.jpg`), link: `https://youtu.be/${encodeURIComponent(v)}`, video: true };
      }
      return { src: raw.startsWith('https://firebasestorage.googleapis.com/') ? pfUrl(raw) : raw };
    }).filter(Boolean);
  }
  async function pfImage(it) {
    const img = new Image();
    await new Promise((ok, no) => {
      const t = setTimeout(no, 25000);
      img.onload = () => { clearTimeout(t); ok(); };
      img.onerror = () => { clearTimeout(t); no(); };
      img.src = it.src;
    });
    // 작품이 잘리지 않게 4:3 칸 안에 전체가 보이도록
    const W = 800, H = 600, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#f1f5f9'; g.fillRect(0, 0, W, H);
    const s = Math.min(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
    g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    if (it.video) {   // 영상은 재생 표시(PDF에서 누르면 유튜브로 이동)
      g.fillStyle = 'rgba(15,23,42,.72)'; g.beginPath(); g.arc(W / 2, H / 2, 58, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.moveTo(W / 2 - 18, H / 2 - 28); g.lineTo(W / 2 + 30, H / 2); g.lineTo(W / 2 - 18, H / 2 + 28); g.closePath(); g.fill();
    }
    const data = cv.toDataURL('image/jpeg', 0.82);
    cv.width = 0; cv.height = 0; img.src = '';
    return { data, link: it.link };
  }
  async function portfolio(id, items, add, tick) {
    if (!items.length) return 0;
    const out = new Array(items.length);
    let next = 0;
    await Promise.all(Array.from({ length: Math.min(4, items.length) }, async () => {
      while (next < items.length) {
        const k = next++;
        try { out[k] = await pfImage(items[k]); } catch (_) { out[k] = null; }
        tick();
      }
    }));
    const ok = out.filter(Boolean);
    if (ok.length) {
      const h = await host(820, 'pdf-curr');
      h.innerHTML = `<div class="pdf-curr__head"><p class="pdf-curr__org">${rmEsc(ORG)}</p><p class="pdf-curr__title">${rmEsc(COURSES[id].label || '')} 포트폴리오</p></div>`;
      try { await fontsFor(h); add.breakPage(); add.flow(await shot(h.firstChild, 1.7)); } finally { h.remove(); }
      add.grid(ok);
    }
    return items.length - ok.length;
  }

  // A4에 넣기: 가로 페이지(노선도) / 세로로 이어 붙이기(커리큘럼)
  // 그림은 넣자마자 비움 → 메모리가 적은 휴대폰에서도 끊기지 않게
  function assembler() {
    const { jsPDF } = window.jspdf;
    let pdf = null, y = Infinity;   // y: 커리큘럼 이어 붙이는 위치(첫 블록에서 새 쪽 시작)
    const page = land => {
      if (!pdf) pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: land ? 'landscape' : 'portrait', compress: true });
      else pdf.addPage('a4', land ? 'landscape' : 'portrait');
    };
    const jpg = cv => cv.toDataURL('image/jpeg', 0.86);
    const free = cv => { cv.width = 0; cv.height = 0; };
    return {
      land(cv) {
        page(true);
        const W = 297, H = 210, M = 10;
        const s = Math.min((W - 2 * M) / cv.width, (H - 2 * M) / cv.height);
        const w = cv.width * s, hh = cv.height * s;
        pdf.addImage(jpg(cv), 'JPEG', (W - w) / 2, (H - hh) / 2, w, hh);
        free(cv);
      },
      flow(cv) {
        if (!cv.width || !cv.height) return;
        const M = 12, CW = 210 - 2 * M, CH = 297 - 2 * M, GAP = 3;
        const k = CW / cv.width;            // 캔버스 1px → mm
        const full = cv.height * k;
        // 한 쪽에 다 들어가는 블록은 쪽 중간에서 잘리지 않게 다음 쪽으로
        if (y + full > M + CH && y !== M && full <= CH) { page(false); y = M; }
        let from = 0;
        while (from < cv.height) {
          let room = M + CH - y;
          if (room < 20) { page(false); y = M; room = CH; }
          const takePx = Math.min(cv.height - from, Math.max(1, Math.floor(room / k)));
          const piece = document.createElement('canvas'); piece.width = cv.width; piece.height = takePx;
          piece.getContext('2d').drawImage(cv, 0, from, cv.width, takePx, 0, 0, cv.width, takePx);
          pdf.addImage(jpg(piece), 'JPEG', M, y, CW, takePx * k);
          free(piece);
          y += takePx * k + GAP; from += takePx;
          if (from < cv.height) { page(false); y = M; }
        }
        free(cv);
      },
      breakPage() { y = Infinity; },
      // 포트폴리오: 2열 격자(영상 칸은 누르면 유튜브로)
      grid(items) {
        const M = 12, CW = 210 - 2 * M, CH = 297 - 2 * M, GAP = 4;
        const w = (CW - GAP) / 2, h = w * 3 / 4;
        items.forEach((it, i) => {
          const col = i % 2;
          if (col === 0 && y + h > M + CH) { page(false); y = M; }
          const x = M + col * (w + GAP);
          pdf.addImage(it.data, 'JPEG', x, y, w, h);
          if (it.link) pdf.link(x, y, w, h, { url: it.link });
          if (col === 1 || i === items.length - 1) y += h + GAP;
        });
      },
      blob: () => pdf.output('blob'),
    };
  }

  const safe = s => String(s).replace(/[/:*?"<>|]/g, '_').trim();
  const IN_APP = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
  // 찍은 화면만 PDF로: curr=학과 커리큘럼+포트폴리오 / line=노선 상세 한 장 / map=전체 노선도 한 장
  function target(kind, id) {
    if (kind === 'curr') {
      const l = COURSES[id]?.label || '학과';
      return { title: `${l} 커리큘럼`, param: encodeURIComponent(id), file: `${safe(l)}_커리큘럼.pdf` };
    }
    if (kind === 'line') {
      const r = rmRows().find(x => x.id === id);
      const l = r ? rmText(id + '_label', r.label) : rmText('hub_name', RMAP.hub.name);
      return { title: `${l} 로드맵`, param: 'line-' + encodeURIComponent(id), file: `${safe(l)}_로드맵.pdf` };
    }
    return { title: '전체 로드맵', param: 'roadmap', file: 'AI커리큘럼_로드맵.pdf' };
  }
  async function make(kind, id) {
    if (busy) return; busy = true;
    show('PDF 만드는 중…', '잠시만 기다려 주세요', [], true);
    try {
      await loadLibs();
      await document.fonts.ready;
      const add = assembler();
      const name = target(kind, id).file;
      let done = 0, total = 1, missed = 0;
      const step = () => { const s = sheet().querySelector('.pdfx__sub'); s.textContent = `${++done} / ${total}`; };
      if (kind === 'curr') {
        const pf = pfEntries(COURSES[id]);
        total = 1 + pf.length;
        await curriculum(id, add); step();
        missed = await portfolio(id, pf, add, step);
      } else if (kind === 'line') {
        add.land(await detail(id)); step();
      } else {
        add.land(await overview()); step();
      }
      const blob = add.blob();
      const file = new File([blob], name, { type: 'application/pdf' });
      const mb = (blob.size / 1048576).toFixed(1);
      const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
      const save = () => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      };
      const share = async () => {
        try { await navigator.share({ files: [file], title: name }); hide(); }
        catch (e) { if (e && e.name !== 'AbortError') showToast('공유 창을 열지 못했어요. 저장하기를 눌러 주세요', 'error'); }
      };
      // 카카오톡 앱 등 안에서 QR을 열면 파일 저장이 막힐 수 있음
      const hint = (missed ? `\n사진 ${missed}장은 불러오지 못해 빠졌어요` : '')
        + (IN_APP ? "\n저장이 안 되면 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요" : '');
      show('PDF가 준비됐어요', `${name} · ${mb}MB${hint}`, [
        ...(canShare ? [['카카오톡 등으로 공유하기', share, true]] : []),
        ['기기에 저장하기', save, !canShare],
        ...(PDF_PARAM ? [] : [['닫기', hide]]),
      ]);
    } catch (e) {
      console.error('[pdf]', e);
      show('PDF를 만들지 못했어요', e && e.message ? e.message : '잠시 후 다시 해 주세요',
        [PDF_PARAM ? ['다시 시도', () => location.reload(), true] : ['닫기', hide, true]]);
    } finally { busy = false; dropStage(); }
  }

  // 태블릿: QR 띄우기(학생이 휴대폰으로 찍으면 그 휴대폰에서 PDF를 만듦)
  async function showQr(kind, id) {
    const t = target(kind, id), label = t.title;
    const url = `${location.origin}/?pdf=${t.param}`;
    const local = ['이 기기에 저장하기', () => make(kind, id)];
    show('QR 만드는 중…', '', [], true);
    try {
      await loadQr();
      const q = window.qrcode(0, 'M'); q.addData(url); q.make();
      const n = q.getModuleCount();
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      show(`${label} PDF 받기`, '휴대폰 카메라로 QR을 찍어 주세요', [local, ['닫기', hide]]);
      sheet().querySelector('.pdfx__qr').innerHTML =
        `<svg viewBox="-4 -4 ${n + 8} ${n + 8}" shape-rendering="crispEdges" role="img" aria-label="${rmEsc(label)} PDF 받는 QR 코드">`
        + `<rect x="-4" y="-4" width="${n + 8}" height="${n + 8}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    } catch (e) {
      console.error('[qr]', e);
      show('QR을 만들지 못했어요', '인터넷 연결을 확인해 주세요', [local, ['닫기', hide]]);
    }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-pdf]');
    if (!b) return;
    if (b.dataset.pdf === 'curr') showQr('curr', currentCourse);
    else if (typeof rmapOpen !== 'undefined' && rmapOpen) showQr('line', rmapOpen);
    else showQr('map');
  });

  // 학생 휴대폰: 데이터가 오면 바로 PDF 만들기
  if (PDF_PARAM) {
    show('PDF 만드는 중…', '잠시만 기다려 주세요', [], true);
    const go = () => {
      const line = PDF_PARAM.startsWith('line-') ? PDF_PARAM.slice(5) : '';
      if (PDF_PARAM === 'roadmap') make('map');
      else if (line && (line === 'hub' || rmRows().some(r => r.id === line))) make('line', line);
      else if (COURSES[PDF_PARAM]) make('curr', PDF_PARAM);
      else location.replace('/');
    };
    if (window.__dataReady) go(); else window.addEventListener('app:data-ready', go, { once: true });
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
/* 새 배포 자동 적용: 열어 둔 태블릿 화면이 옛 버전으로 남지 않게, 최신 버전인지 확인해 바뀌었으면 새로고침.
   - 다른 앱·잠금 화면에서 돌아올 때 확인
   - 10분마다 확인하되, 상담 도중 화면이 바뀌지 않게 첫 화면(학원 소개)에 있을 때만 새로고침
   - 관리자 편집 중·로그인 창·PDF 화면에서는 새로고침하지 않음 */
(function autoUpdate() {
  if (location.protocol === 'file:' || /[?&]pdf=/.test(location.search)) return;
  const tag = () => fetch('/', { method: 'HEAD', cache: 'no-store' })
    .then(r => (r.ok ? r.headers.get('etag') || r.headers.get('last-modified') : null)).catch(() => null);
  let base = null;
  tag().then(t => { base = t; });
  const busy = () => isEditMode || (document.getElementById('login-modal') || {}).style?.display === 'flex';
  async function check(onlyIntro) {
    if (!base || document.hidden || busy()) return;
    if (onlyIntro && currentPage !== 'intro') return;
    const t = await tag();
    if (t && t !== base && !busy()) location.reload();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(false); });
  setInterval(() => check(true), 10 * 60 * 1000);
})();
</script>
