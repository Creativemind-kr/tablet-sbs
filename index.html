  /* ══════════════════════════════════════
     16. TOAST
  ══════════════════════════════════════ */
  .toast {
    position: fixed;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: #111;
    color: #fff;
    padding: 11px 22px;
    border-radius: 99px;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
    z-index: 600;
    opacity: 0;
    transition: opacity 200ms, transform 200ms;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #EF4444; }

  /* ══ 자격증 월별 타임라인 ══ */
  /* ══ D-Day 자격증 현황표 ══ */
  .exam-dday-wrap { background:var(--c-bg-2); border-radius:14px; margin-bottom:22px; overflow:hidden; }
  .exam-dday-table { width:100%; border-collapse:collapse; }
  .exam-dday-table th { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--c-text-3); padding:12px 14px; text-align:left; border-bottom:1px solid var(--c-border); white-space:nowrap; }
  .exam-dday-table td { padding:11px 14px; border-bottom:1px solid var(--c-border); vertical-align:middle; font-size:13px; }
  .exam-dday-table tbody:last-child tr:last-child td { border-bottom:none; }
  .exam-dday-table tr:hover td { background:rgba(0,0,0,.025); }
  .exam-dday-table .edd-sec td:first-child { box-shadow:inset 4px 0 0 var(--g); }
  .exam-dday-table tr.edd-group td, .exam-dday-table tr.edd-group:hover td { background:#fff; padding:14px 14px 8px; border-top:10px solid var(--c-bg-2); }
  .exam-dday-table .edd-sec:first-of-type tr.edd-group td { border-top:0; }
  .edd-group__name { font-size:14px; font-weight:800; color:var(--g); }
  .edd-group__org { margin-left:8px; font-size:11px; font-weight:600; color:var(--c-text-3); }
  @media (max-width: 600px) { .exam-dday-table th:nth-child(2), .exam-dday-table td.edd-round { display:none; } .exam-dday-table td, .exam-dday-table th { padding-left:10px; padding-right:10px; } .edd-date { white-space:nowrap; } }
  .edd-name { font-weight:700; color:var(--c-text); font-size:13px; }
  .edd-round { color:var(--c-text-3); font-size:12px; white-space:nowrap; }
  .edd-date { color:var(--c-text-2); font-size:12px; }
  .dday-pill { display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:6px; white-space:nowrap; letter-spacing:-.01em; }
  .dday-hot    { background:#FEE2E2; color:#DC2626; }
  .dday-soon   { background:#FEF3C7; color:#D97706; }
  .dday-ok     { background:#DCFCE7; color:#16A34A; }
  .dday-today  { background:#DC2626; color:#fff; }
  .dday-wait   { background:var(--c-bg-2); color:var(--c-text-3); border:1px solid var(--c-border); }
  .dday-always { background:#F1F5F9; color:#64748B; }
  .dday-done   { color:var(--c-text-3); font-size:11px; }

  /* ══ 세로 모드 / 좁은 태블릿 대응 ══ */
  @media (orientation: portrait), (max-width: 820px) {
    .header { padding: 0 14px; gap: 12px; }
    .main-nav__btn { padding: 7px 10px; }
    .page { padding: 32px 20px 64px; }
  }

  /* ══ 자격증 일정 upcoming 강조 ══ */
  .exam-table tr.is-upcoming td { background:#F0FDF4; }
  .exam-upcoming-badge { display:inline-block; font-size:10px; font-weight:700; color:#16a34a; background:#dcfce7; border-radius:4px; padding:1px 5px; margin-left:4px; vertical-align:middle; }

  /* ══ SVG 아이콘 공통 ══ */
  .icon-svg { display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; flex-shrink:0; }
  .kedustore-banner__icon .icon-svg { color:#1E3461; }

  /* ══ 학과별 로드맵: 2호선 노선도 뷰어 ══ */
  #page-roadmap { padding: 24px 28px; overflow: hidden; }
  #page-roadmap .page__inner { max-width: none; height: 100%; display: flex; flex-direction: column; }
  #page-roadmap .page-label-row { flex-shrink: 0; flex-wrap: nowrap; margin-bottom: 16px; }
  #page-roadmap .page-label-row .page-label,
  #page-roadmap .pretest-btn { margin-bottom: 0; }
  .rmap__head { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
  .rmap__hint {
    margin: 0; font-size: var(--t-sm); color: var(--c-text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: keep-all;
  }
  /* 노선도 판: PDF 카드 바깥 여백을 잘라 낸 흰 바탕 그림이라 판도 흰색으로 이어 붙임 */
  .rmap {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    border: 1px solid var(--c-border); border-radius: 16px; background: #fff;
    user-select: none; -webkit-user-select: none;
  }
  .rmap__view { position: absolute; inset: 0; overflow: hidden; touch-action: manipulation; }
  .rmap__view.is-dragging { cursor: grabbing; }
  .rmap__stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .rmap__stage.is-anim { transition: transform 280ms var(--ease); }
  .rmap__svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .rmap__texts {
    position: absolute; inset: 0; color: #0f172a; word-break: keep-all; text-shadow: none;
    font-family: 'Pretendard Variable', Pretendard, var(--font); font-kerning: normal;
  }
  .rmap__texts > div { position: absolute; pointer-events: none; }
  .rmap__texts div { margin: 0; }
  .rm-pl, .rm-title, .rm-hnum, .rm-hname, .rm-cert__n, .rm-brand__n { font-family: 'RM Paperlogy', 'Pretendard Variable', Pretendard, var(--font); }
  /* 역 이름(전체 보기에서도 보임) + 과목 설명(확대하면 보임) */
  .rm-st { transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .rm-st--up { flex-direction: column-reverse; }
  .rm-n { font-size: 14.5px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; white-space: pre-line; }
  .rm-st--x .rm-n { color: #065f46; }
  .rm-st--r .rm-n { color: #5b21b6; }
  .rm-st--b .rm-n { color: #86198f; }
  .rm-st--soon .rm-n { color: #64748b; }
  .rm-d { font-size: 10px; font-weight: 500; line-height: 1.28; color: #64748b; white-space: pre-line; letter-spacing: -0.01em; }
  /* 전체 보기에선 노선·역 이름만, 확대하면 과목 설명이 나타남(편집 모드는 항상 보임) */
  .rm-d { transition: opacity 180ms, visibility 180ms; }
  .rmap__view:not(.is-detail) .rm-d { opacity: 0; visibility: hidden; }
  .app.admin-edit .rmap__view .rm-d { opacity: 1; visibility: visible; }
  .rm-badge {
    transform: translate(-50%, -100%); font-size: 10px; font-weight: 800; line-height: 1; letter-spacing: -0.01em;
    padding: 4px 7px 3.5px; border-radius: 999px; color: #fff; white-space: nowrap;
  }
  .rm-badge--po { background: #0f172a; }
  .rm-badge--ai { background: #059669; }
  .rm-badge--rv { background: #7c3aed; }
  .rm-badge--r { transform: translate(0, -100%); }
  .rm-pill {
    transform: translate(-50%, -100%); display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; color: var(--ci, var(--c));
    background: #fff; border: 2px solid var(--c); border-radius: 999px; padding: 4px 10px 4px 8px; white-space: nowrap;
  }
  .rm-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  /* 전체 노선도: 노선 이름표·둘레 칸을 누르면 상세 */
  .rmap__texts > .rm-hit { pointer-events: auto; cursor: pointer; border-radius: 16px; -webkit-tap-highlight-color: transparent; transition: background 120ms; }
  .rmap__texts > .rm-hit:active { background: rgba(15,23,42,.05); }
  .rmap__texts > .rm-hit--hub { border-radius: 40px; }
  .rmap__texts > .rm-pill {
    pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent;
    font-size: 15px; gap: 6px; padding: 4px 8px 4px 10px; border-width: 2px; box-shadow: 0 2px 6px rgba(15,23,42,.10);
    transition: background 120ms;
  }
  .rmap__texts > .rm-pill::before { width: 10px; height: 10px; }
  .rmap__texts > .rm-pill::after { content: '›'; font-size: 1.45em; line-height: .55; margin-left: 1px; }
  .rmap__texts > .rm-pill--l { padding: 4px 10px 4px 8px; }
  .rmap__texts > .rm-pill--l::before { content: '‹'; width: auto; height: auto; border-radius: 0; background: none; font-size: 1.45em; line-height: .55; margin-right: 1px; }
  .rmap__texts > .rm-pill--l::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; margin-left: 0; }
  .rmap__texts > .rm-pill:active { background: color-mix(in srgb, var(--c) 12%, #fff); }
  .rm-solo { transform: translate(-50%, -100%); font-size: 13px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; color: var(--c); white-space: nowrap; pointer-events: none; }
  /* 노선 상세(전체 노선도 위에 겹쳐 열림) */
  /* 상세가 열리면 전체 노선도는 아예 숨김(편집 모드 저장 때 가려진 글씨가 빈칸으로 들어가지 않게) */
  .rmap.is-open .rmap__view { display: none; }
  .rmap__detail { position: absolute; inset: 0; z-index: 1; overflow: auto; background: #fff; }
  .rmap__detail[hidden] { display: none; }
  .rmd {
    min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 18px 24px 20px;
    animation: rmdIn 220ms var(--ease);
  }
  @keyframes rmdIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .rmd__bar { display: flex; align-items: center; gap: 10px; }
  .rmd__back, .rmd__go {
    display: inline-flex; align-items: center; gap: 6px; height: 46px; border-radius: 12px; font: inherit;
    font-size: var(--t-sm); font-weight: 800; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  }
  .rmd__back { padding: 0 16px 0 12px; border: 1px solid var(--c-border); background: #fff; color: var(--c-text); }
  .rmd__go { margin-left: auto; padding: 0 14px 0 18px; border: 0; background: var(--ci, var(--c)); color: #fff; }
  .rmd__back span, .rmd__go span { font-size: 24px; line-height: 1; margin-top: -3px; }
  .rmd__back:active { background: var(--c-bg-2); }
  .rmd__go:active { filter: brightness(.92); }
  .rmd__head { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
  .rmd__title { display: flex; align-items: center; gap: 12px; }
  .rmd__name {
    display: inline-flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 900; line-height: 1.15;
    letter-spacing: -0.02em; color: var(--ci, var(--c)); word-break: keep-all;
  }
  .rmd__name::before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .rmd__num + .rmd__name::before { display: none; }
  .rmd__num {
    width: 42px; height: 42px; border-radius: 50%; background: #16a34a; color: #fff; display: grid; place-items: center;
    font-family: 'RM Paperlogy', 'Pretendard Variable', Pretendard, var(--font); font-weight: 900; font-size: 24px; line-height: 1;
  }
  .rmd__sub { font-size: 17px; font-weight: 600; color: #475569; word-break: keep-all; }
  .rmd__body { margin: auto 0; padding: 16px 0 12px; display: flex; flex-direction: column; gap: 26px; }
  .rmd__route {
    flex: 1; min-width: 0; display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 200px)); justify-content: center;
  }
  /* 노선 아래: 결과물 예시 사진 4칸 */
  .rmd__ex { width: 100%; max-width: 1000px; align-self: center; display: flex; flex-direction: column; gap: 10px; }
  .rmd__ex-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .rmd__ex-h { font-size: 15px; font-weight: 800; color: var(--ci, var(--c)); letter-spacing: -0.01em; }
  .rmd__ex-fig { margin: 0; }
  .rmd__ex-fig img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: #f1f5f9; }
  .rmd__ex-fig figcaption { margin-top: 4px; font-size: 10.5px; line-height: 1.3; color: #94a3b8; word-break: keep-all; }
  .rmd__col { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 6px; min-width: 0; }
  .rmd__slot { height: 32px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-sizing: border-box; }
  .rmd__mark { height: 40px; display: grid; place-items: center; position: relative; z-index: 1; }
  /* 앞 역에서 이 역까지 이어지는 선(앞 칸 가운데 → 이 칸 가운데) */
  .rmd__seg { position: absolute; left: -50%; width: 100%; top: 47px; height: 10px; background: var(--sc); }
  .rmd__seg--dash { top: 48px; height: 8px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--sc) 0 10px, transparent 10px 18px); }
  .rmd__dot { display: block; box-sizing: border-box; border-radius: 50%; border: 5px solid var(--lc); background: #fff; }
  .rmd__dot--g { width: 26px; height: 26px; }
  .rmd__dot--a { width: 32px; height: 32px; background: radial-gradient(circle, #059669 0 5.5px, #ecfdf5 6px); }
  .rmd__dot--p { width: 34px; height: 34px; background: radial-gradient(circle, #fff 0 4.5px, #0f172a 5px); }
  .rmd__dot--x { width: 32px; height: 32px; border-color: #059669; background: radial-gradient(circle, #059669 0 6px, #ecfdf5 6.5px); }
  .rmd__dot--r { width: 32px; height: 32px; border-color: #7c3aed; background: radial-gradient(circle, #7c3aed 0 6px, #f5f3ff 6.5px); }
  .rmd__dot--s { width: 26px; height: 26px; border-style: dashed; background: #fff; }
  .rmd__dot--sb { width: 30px; height: 30px; border-style: dashed; border-color: #a21caf; background: radial-gradient(circle, #a21caf 0 5px, #fdf4ff 5.5px); }
  .rmd__dot--b { width: 32px; height: 32px; border-color: #a21caf; background: radial-gradient(circle, #fff 0 5.5px, #a21caf 6px); }
  .rmd__dot--t { width: 38px; height: 38px; border: 6px solid #0f172a; background: radial-gradient(circle, var(--in) 0 7.5px, #fff 8px); }
  .rmd__hub {
    width: 56px; height: 40px; box-sizing: border-box; border-radius: 13px; border: 6px solid #16a34a; background: #fff;
    display: grid; place-items: center; color: #16a34a; line-height: 1;
    font-family: 'RM Paperlogy', 'Pretendard Variable', Pretendard, var(--font); font-weight: 900; font-size: 18px;
  }
  .rmd__n {
    margin-top: 12px; font-size: 21px; font-weight: 800; line-height: 1.22; letter-spacing: -0.02em;
    color: #0f172a; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere;
  }
  .rmd__d { margin-top: 7px; font-size: 15px; font-weight: 500; line-height: 1.42; color: #64748b; white-space: pre-line; word-break: keep-all; }
  .rmd__badge { font-size: 12px; font-weight: 800; line-height: 1; color: #fff; border-radius: 999px; padding: 4.5px 9px; white-space: nowrap; }
  .rmd__badge--po { background: #0f172a; }
  .rmd__badge--ai, .rmd__badge--core { background: #059669; }
  .rmd__badge--core { background: #16a34a; }
  .rmd__badge--rv { background: #7c3aed; }
  .rmd__badge--biz { background: #a21caf; }
  .rmd__badge--soon { background: #b45309; }
  .rmd__badge--start { background: var(--c); }
  .rmd__legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 14px 80px 0 0; border-top: 1px solid #eef2f7; }
  .rmd__legend .rm-lg__t { font-size: 13px; }
  @media (max-width: 820px) {
    .rmap .rmd { padding: 14px 16px 16px; }
    .rmap .rmd__name { font-size: 24px; }
    .rmap .rmd__n { font-size: 17px; }
    .rmap .rmd__d { font-size: 13px; }
  }
  /* 높이가 낮은 가로 화면(1024×768, 1280×800 등): 간격·사진 폭을 줄여 한 화면에 */
  @media (orientation: landscape) and (max-height: 800px) {
    .rmap .rmd { padding-top: 14px; padding-bottom: 14px; }
    .rmap .rmd__head { margin-top: 12px; }
    .rmap .rmd__name { font-size: 28px; }
    .rmap .rmd__body { gap: 16px; padding: 8px 0 8px; }
    .rmap .rmd__ex { max-width: 860px; gap: 8px; }
    .rmap .rmd__legend { padding-top: 10px; }
  }
  /* 세로 화면: 역이 위에서 아래로 내려가는 세로 노선(칸 높이 고정 → 앞 역 점에서 이 역 점까지 선을 이음) */
  @media (orientation: portrait) {
    .rmap .rmd__body { gap: 18px; }
    .rmap .rmd__route { grid-template-columns: minmax(0, 560px); grid-auto-rows: 88px; padding: 4px 0; }
    .rmap .rmd__ex-grid { gap: 8px; }
    .rmap .rmd__col {
      display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: auto auto 1fr;
      column-gap: 14px; align-items: start; justify-items: start; text-align: left; padding: 0;
    }
    .rmap .rmd__mark { grid-column: 1; grid-row: 1 / 4; height: 44px; justify-self: stretch; }
    .rmap .rmd__slot { grid-column: 2; grid-row: 1; height: auto; padding: 0 0 5px; justify-content: flex-start; }
    .rmap .rmd__slot:empty { display: none; }
    .rmap .rmd__n { grid-column: 2; grid-row: 2; margin-top: 0; font-size: 19px; }
    .rmap .rmd__d { grid-column: 2; grid-row: 3; margin-top: 3px; font-size: 14px; }
    .rmap .rmd__seg { left: 23px; width: 10px; top: -66px; height: 88px; }
    .rmap .rmd__seg--dash { left: 24px; width: 8px; top: -66px; height: 88px; background: repeating-linear-gradient(180deg, var(--sc) 0 10px, transparent 10px 18px); }
  }
  /* 가운데 순환선 */
  .rm-hnum { transform: translate(-50%, -50%); font-weight: 900; font-size: 40px; line-height: 1; color: #fff; }
  .rm-htag, .rm-loop {
    transform: translate(-50%, -50%); font-weight: 800; color: #fff; background: #15803d;
    border-radius: 999px; white-space: nowrap; line-height: 1.1;
  }
  .rm-htag { font-size: 12.5px; padding: 4px 11px; }
  .rm-loop { font-size: 9.5px; padding: 2px 6px; border: 1.5px solid #fff; }
  .rm-hname { transform: translateX(-50%); font-weight: 800; font-size: 28px; line-height: 1.1; white-space: nowrap; }
  .rm-hdesc { transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .rm-hd { font-size: 12px; font-weight: 600; line-height: 1.4; color: #475569; white-space: nowrap; }
  .rm-core {
    transform: translateX(-50%); box-sizing: border-box; padding: 12px 6px 8px; background: #fff;
    border: 2.5px solid #16a34a; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center;
  }
  .rm-core__tag {
    position: absolute; left: 50%; top: 0; transform: translate(-50%, -55%); font-size: 9.5px; font-weight: 800; line-height: 1.1;
    color: #fff; background: #16a34a; border-radius: 999px; padding: 2.5px 8px; white-space: nowrap;
  }
  .rm-core__name { font-size: 14.5px; font-weight: 800; line-height: 1.15; white-space: nowrap; letter-spacing: -0.03em; }
  .rm-core__kw { font-size: 12.5px; font-weight: 700; line-height: 1.2; color: #15803d; white-space: nowrap; }
  .rmd__kw { margin-top: 5px; font-size: 15px; font-weight: 700; line-height: 1.3; color: #15803d; }
  .rm-core__desc { font-size: 10px; line-height: 1.25; color: #475569; }
  .rmap__view:not(.is-detail) .rm-core__desc { display: none; }
  /* 머리줄: 제목(왼쪽 위)·범례(오른쪽 위, 가로) */
  .rm-bar { left: 24px; right: 24px; top: 12px; height: 5px; border-radius: 3px; background: #00a84d; }
  .rm-head { left: 32px; top: 28px; display: flex; flex-direction: column; gap: 7px; }
  .rm-title { font-weight: 900; font-size: 27px; line-height: 1; white-space: nowrap; }
  .rm-sub { font-size: 13.5px; font-weight: 700; line-height: 1.2; color: #475569; white-space: nowrap; }
  .rm-legend {
    right: 28px; top: 30px; display: flex; align-items: center; gap: 20px;
    padding: 9px 16px; background: #f8fafc; border: 1.2px solid #e2e8f0; border-radius: 12px;
  }
  .rm-lg { display: flex; align-items: center; gap: 7px; }
  .rm-lg__t { font-size: 14.5px; font-weight: 700; color: #334155; white-space: nowrap; }
  .rm-lg__dot { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; border: 3.5px solid; }
  .rm-lg__dot--g { border-color: #94a3b8; background: #fff; }
  .rm-lg__dot--a { border-color: #16a34a; background: radial-gradient(circle, #059669 0 2.6px, #ecfdf5 3px); }
  .rm-lg__dot--p { border-color: #64748b; background: radial-gradient(circle, #fff 0 1.8px, #0f172a 2.2px); }
  .rm-lg__dot--r { border-color: #7c3aed; background: radial-gradient(circle, #7c3aed 0 2.6px, #f5f3ff 3px); }
  .rm-lg__dot--s { border-color: #94a3b8; border-style: dashed; background: #fff; }
  .rm-lg__dot--b { border-color: #a21caf; background: radial-gradient(circle, #fff 0 2.4px, #a21caf 2.8px); }
  /* 아래 자격시험 칸 */
  .rm-foot {
    left: 24px; right: 24px; bottom: 14px; height: 66px; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
    padding: 0 8px 0 14px; background: #f8fafc; border: 1.2px solid #e2e8f0; border-radius: 14px;
  }
  .rm-foot__pill { flex-shrink: 0; font-size: 12px; font-weight: 800; color: #fff; background: #0f172a; border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .rm-cert {
    flex: 1; min-width: 0; height: 46px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 0 10px 0 16px; background: #fff; border: 1.2px solid #e2e8f0; border-radius: 10px;
  }
  .rm-cert::before { content: ''; position: absolute; left: 7px; top: 9px; bottom: 9px; width: 3.5px; border-radius: 2px; background: var(--c); }
  .rm-cert__n { font-weight: 800; font-size: 16px; line-height: 1.1; color: var(--c); white-space: nowrap; }
  .rm-cert__d { font-size: 10.5px; font-weight: 600; color: #475569; white-space: nowrap; }
  .rm-brand {
    flex: 0 0 290px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: #0f172a; border-radius: 11px;
  }
  .rm-brand__n { font-weight: 800; font-size: 16px; line-height: 1.1; color: #fff; white-space: nowrap; }
  .rm-brand__b { font-size: 11px; font-weight: 700; color: #4ade80; letter-spacing: .06em; white-space: nowrap; }
  /* 편집 모드: 고칠 수 있는 글씨 표시 */
  .app.admin-edit .rmap__texts [contenteditable] {
    pointer-events: auto; cursor: text; user-select: text; -webkit-user-select: text;
    outline: 1.5px dashed rgba(59,130,246,.6); outline-offset: 2px; border-radius: 3px; min-width: 12px;
  }
  .app.admin-edit .rmap__texts [contenteditable]:focus { outline: 2.5px solid #3B82F6; background: rgba(255,255,255,.9); }
  @font-face { font-family: 'RM Paperlogy'; font-weight: 800; font-display: swap; src: url('fonts/paperlogy-800-rmap.woff2') format('woff2'); }
  @font-face { font-family: 'RM Paperlogy'; font-weight: 900; font-display: swap; src: url('fonts/paperlogy-900-rmap.woff2') format('woff2'); }
  /* 확대·축소 버튼: 노선도 오른쪽 아래에 세로로(전체 보기일 때 지도 옆 빈 곳에 놓임) */
  .rmap__tools {
    position: absolute; right: 12px; bottom: 12px; z-index: 2;
    display: flex; flex-direction: column; gap: 8px;
  }
  .rmap__group {
    display: flex; flex-direction: column; overflow: hidden;
    background: rgba(255,255,255,.96); border: 1px solid var(--c-border); border-radius: 14px;
    box-shadow: 0 2px 10px rgba(17,17,17,.07);
  }
  .rmap__btn {
    width: 52px; height: 48px; padding: 0; border: 0; background: transparent; color: var(--c-text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .rmap__btn + .rmap__btn { border-top: 1px solid var(--c-border); }
  .rmap__btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .rmap__btn--lbl { height: 56px; }
  .rmap__btn--lbl span { font-size: 11px; font-weight: 700; line-height: 1; color: var(--c-text-2); }
  .rmap__btn:active { background: var(--c-bg-2); }
  .rmap__btn:disabled { color: #c8c8c8; cursor: default; }
  .rmap__btn:disabled span { color: #c8c8c8; }
  .rmap__btn .ic-close { display: none; }
  .rmap.is-full .rmap__btn .ic-open { display: none; }
  .rmap.is-full .rmap__btn .ic-close { display: block; }
  .rmap.is-full { position: fixed; inset: 0; z-index: 900; border: 0; border-radius: 0; }
  .rmap.is-full .rmap__tools {
    right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  }
  .app.is-admin #page-roadmap, .app.admin-edit #page-roadmap { padding-bottom: 80px; }
  .rmap__hint--edit { display: none; color: #2563EB; font-weight: 600; }
  .app.admin-edit .rmap__hint--view { display: none; }
  .app.admin-edit .rmap__hint--edit { display: block; }
  @media (orientation: portrait), (max-width: 820px) {
    #page-roadmap { padding: 20px; }
  }
  @media (max-width: 680px) {
    #page-roadmap { padding: 16px 14px; }
    .rmap__hint { display: none; }
  }
  </style>
</head>
<body>

<div class="app" id="app">

  <!-- ══ HEADER ══ -->
  <header class="header">
    <div class="header__logo">
      SBS아카데미
      <span>AIX학원</span>
    </div>
    <nav class="main-nav" role="tablist">
      <button class="main-nav__btn is-active" data-page="intro"        role="tab"><span class="dot"></span>학원 소개</button>
      <button class="main-nav__btn"           data-page="roadmap"      role="tab"><span class="dot"></span>학과별 로드맵</button>
      <button class="main-nav__btn"           data-page="curriculum"   role="tab"><span class="dot"></span>커리큘럼</button>
      <button class="main-nav__btn"           data-page="instructors"  role="tab"><span class="dot"></span>강사 소개</button>
      <button class="main-nav__btn"           data-page="reviews"      role="tab"><span class="dot"></span>수강생 후기</button>
      <button class="main-nav__btn"           data-page="jobs"         role="tab"><span class="dot"></span>채용정보</button>
      <button class="main-nav__btn"           data-page="checklist"    role="tab"><span class="dot"></span>준비물 안내</button>
      <button class="main-nav__btn"           data-page="exams"        role="tab"><span class="dot"></span>자격증 일정</button>
    </nav>
    <!-- 2초 길게 누르면 관리자 로그인 -->
    <div class="header__indicator" id="indicator" title="">1 / 7</div>
  </header>

  <!-- ══ CONTENT ══ -->
  <div class="content-area">

    <!-- ── PAGE 1: 학원 소개 (동적 렌더링) ── -->
    <div class="page is-active" id="page-intro">
      <video class="intro-bg-video" loop muted playsinline preload="none"></video>
      <div class="intro-bg-overlay"></div>
      <div class="page__inner" id="intro-content"></div>
    </div>

    <!-- ── PAGE 2: 학과별 로드맵 ── -->
    <div class="page" id="page-roadmap">
      <div class="page__inner">
        <div class="page-label-row">
          <div class="rmap__head">
            <p class="page-label">학과별 로드맵</p>
            <p class="rmap__hint rmap__hint--view">노선이나 가운데 순환선을 누르면 과목과 설명이 크게 보여요</p>
            <p class="rmap__hint rmap__hint--edit">편집: 노선을 눌러 상세 화면에서 글씨를 바로 고치기 → 저장</p>
          </div>
          <div class="page-btns">
          <button type="button" class="pdf-btn" data-pdf="roadmap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>PDF 받기</button>
          <a href="https://aix-level-test.vercel.app/" target="_blank" rel="noopener" class="pretest-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            사전테스트 바로가기
          </a>
          </div>
        </div>
        <!-- AI 커리큘럼 로드맵(2호선 노선도): 선은 SVG, 글씨는 실제 텍스트(편집 모드에서 수정)
             노선·역 구조는 스크립트의 RMAP, 그리기는 renderRoadmapMap() -->
        <div class="rmap" id="rmap">
          <div class="rmap__view" id="rmap-view">
            <div class="rmap__stage" id="rmap-stage">
              <svg class="rmap__svg" id="rmap-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
              <div class="rmap__texts" id="rmap-texts" aria-label="AI 커리큘럼 로드맵 — 2호선 순환노선형 노선도"></div>
            </div>
          </div>
          <div class="rmap__detail" id="rmap-detail" hidden></div>
        </div>
      </div>
    </div>

    <!-- ── PAGE 3: 커리큘럼 ── -->
    <div class="page" id="page-curriculum">
      <div class="page__inner">

  { name: '음유진', course: '실내건축기사 자격증', text: '2회차 목표로 준비하고 있었는데 강사님께서 시험에 중요한 내용들과 팁을 자세히 알려주셔서 준비 기간을 줄일 수 있었습니다. 1:1피드백도 자세하고 적극적으로 해주셔서 큰 도움이 됐습니다. 강사님 덕분에 1회차 합격했습니다!', star: 5, date: '25.06.14', badge: '1회 합격' },
  { name: '김진령', course: '실내건축기사 자격증', text: '늦은 나이에 시작해서 많은 걱정이었는데 선생님의 열정으로 시험까지 칠 수 있었고, 도면도 하나하나 검토해 주시고 시험 당일까지 좋은 정보를 주셔서 많은 도움이 되었습니다. 실내건축기사 시험 보시는 분들 꼭 추천드립니다!', star: 5, date: '25.05.03', badge: '합격' },

  { name: '김태우', course: '전산응용기계제도기능사', text: '2D·3D 캐드 기초부터 심화까지 완벽히 익히고 자격증도 취득했습니다. 질문이 많았음에도 하나하나 꼼꼼히 알려주셨고 시험 전에도 자신감을 붙여주셨습니다. 연습만 잘하면 누구나 자격증 딸 수 있습니다!', star: 5, date: '25.12.24', badge: '합격' },

function logoUrl(slug) {
  if (!slug) return '';
  if (LOGO_DATA[slug]) return LOGO_DATA[slug];
  if (slug.startsWith('iconify:')) {
    const rest = slug.slice(8);
    const col  = rest.split(':')[0];
    const icon = rest.split(':')[1];
    return `https://api.iconify.design/${col}/${icon}.svg?color=%23888`;
  }
  return `https://cdn.jsdelivr.net/npm/simple-icons@11/icons/${slug}.svg`;
}

  return text.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(?:\/[^\s<]*)?)/g, url => {
    if (url.includes('@') || !url.includes('.')) return url;
    const href = /^https?:\/\//.test(url) ? url : `https://${url}`;
    return `<a href="${href}" target="_blank" rel="noopener" style="color:var(--c-course);text-decoration:underline;word-break:break-all">${url}</a>`;
  });
}

/* ══════════════════════════════════════════════════
   PATH HELPERS
══════════════════════════════════════════════════ */
function setByPath(path, value) {
  const parts = path.split('.');
  const root  = parts[0];
  const keys  = parts.slice(1);
  if (root === 'ui' && keys[0] === 'roadmapMap') { setRoadmapText(keys[1], value); return; }
  let curr;
  if (root === 'ui')          curr = UI_DATA;
  else if (root === 'instructors') curr = INSTRUCTORS_DATA;
  else if (root === 'reviews')     curr = REVIEWS_DATA;
  else                             curr = COURSES;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = keys[i];
    curr = curr[isNaN(k) ? k : +k];
    if (curr == null) return;
  }
  const last = keys[keys.length - 1];
  curr[isNaN(last) ? last : +last] = value;
}

function maskName(name) {
  if (!name) return name;
  return name.charAt(0) + '○'.repeat(Math.min(name.length - 1, 2));
}

/* Editable span helper — wraps text in contenteditable only in edit mode */
function E(path, text) {
  if (!isEditMode) return String(text);
  const safe = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<span contenteditable="true" data-path="${path}" class="admin-editable">${safe}</span>`;
}

const FB_READY = !FIREBASE_CONFIG.apiKey.startsWith('여기에');

async function initFirebase() {
  if (!FB_READY) { console.info('Firebase 미설정 — 오프라인 모드로 실행 중'); return; }
  try {

    loadStorageSDK();

  }
}

function loadStorageSDK() {
  if (typeof firebase === 'undefined' || storage) return;
  const s = document.createElement('script');
  s.src = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js';
  s.onload = () => { try { storage = firebase.storage(); } catch(e) {} };
  document.head.appendChild(s);
}

const CURRICULUM_DOC_IDS = ['ui', 'instructors', 'reviews', 'books', 'jobs', 'kegJobs']; // 'courses'는 학과별 서브컬렉션(depts)으로 분리 저장 (1MB 문서 제한 회피)
let _knownDeptIds = new Set(); // Firestore에 이미 저장된 학과 id — 삭제된 학과의 잔여 문서를 정리하기 위해 추적

function applyFirestoreData(data) {
  if (!data) return;
  if (data.courses && Object.keys(data.courses).length) COURSES = data.courses;
  if (data.ui)          UI_DATA          = data.ui;
  if (data.instructors) {
    INSTRUCTORS_DATA = data.instructors.map(inst => {
      if (!Array.isArray(inst.subjects)) {
        inst.subjects = inst.subject ? inst.subject.split(/[·,]/).map(s=>s.trim()).filter(Boolean) : [];
        delete inst.subject;
      }
      return inst;
    });
  }
  if (data.reviews)     REVIEWS_DATA     = data.reviews;
  if (Array.isArray(data.jobs)) JOBS_DATA = data.jobs;
  if (Array.isArray(data.kegJobs)) KEG_JOBS = data.kegJobs;
  if (data.books)       Object.assign(BOOKS_DATA, data.books);
}

async function loadFromFirestore() {
  if (!db) return;
  try {
    const [deptSnap, ...snaps] = await Promise.all([
      db.collection('curriculum').doc('courses').collection('depts').get(),
      ...CURRICULUM_DOC_IDS.map(id => db.collection('curriculum').doc(id).get())
    ]);
    snaps.forEach(s => { if (s.exists) applyFirestoreData(s.data()); });

    let coursesLoaded = false;
    if (!deptSnap.empty) {
      const courses = {};
      deptSnap.forEach(d => { courses[d.id] = d.data(); _knownDeptIds.add(d.id); });
      COURSES = courses;
      coursesLoaded = true;
    } else {
      // 과거 단일 courses 문서에서 마이그레이션 (다음 저장 시 자동으로 depts 서브컬렉션으로 분리 저장됨)
      const legacyCourses = await db.collection('curriculum').doc('courses').get();
      if (legacyCourses.exists && legacyCourses.data().courses) {
        COURSES = legacyCourses.data().courses;
        Object.keys(COURSES).forEach(id => _knownDeptIds.add(id));
        coursesLoaded = true;
      }
    }

    if (!coursesLoaded && !snaps.some(s => s.exists)) {
      // 구버전 단일 문서(main)에서 마이그레이션
      const legacy = await db.collection('curriculum').doc('main').get();
      if (legacy.exists) applyFirestoreData(legacy.data());
    }
  } catch(e) {
    console.warn('데이터 로드 실패, 기본값 사용:', e.message);
  }
}

async function saveData() {
  if (!db) {
    showToast('Firebase 미연결 — FIREBASE_CONFIG 설정 필요', 'error');
    throw new Error('Firebase 미연결');
  }
  const updatedAt = new Date().toISOString();
  const deptsRef = db.collection('curriculum').doc('courses').collection('depts');
  const currentDeptIds = Object.keys(COURSES);
  const deptWrites = currentDeptIds.map(id => deptsRef.doc(id).set({ ...COURSES[id], updatedAt }));
  const removedDeptIds = [..._knownDeptIds].filter(id => !currentDeptIds.includes(id));
  const deptDeletes = removedDeptIds.map(id => deptsRef.doc(id).delete());
  await Promise.all([
    ...deptWrites,
    ...deptDeletes,
    db.collection('curriculum').doc('ui').set({ ui: UI_DATA, updatedAt }),
    db.collection('curriculum').doc('instructors').set({ instructors: INSTRUCTORS_DATA, updatedAt }),
    db.collection('curriculum').doc('reviews').set({ reviews: REVIEWS_DATA, updatedAt }),
    db.collection('curriculum').doc('jobs').set({ jobs: JOBS_DATA, updatedAt }),
    db.collection('curriculum').doc('books').set({ books: BOOKS_DATA, updatedAt }),
  ]);
  _knownDeptIds = new Set(currentDeptIds);
  showToast('저장되었습니다 ✓');
}

/* ══ 사진 크롭 모달 ══════════════════════════════ */
let _cropIdx = -1;
let _cropX = 0, _cropY = 0, _cropScale = 1;
let _cropNatW = 0, _cropNatH = 0;
let _cropMinScale = 1;
let _cropDragging = false, _cropLast = null;
let _cropPinchDist = 0;

const CROP_VW = 240, CROP_VH = 300;   // 뷰포트 (4:5)
const CROP_OUT_W = 192, CROP_OUT_H = 240; // 저장 크기 (2× Retina)

function openInstCrop(idx) {
  _cropIdx = idx;
  document.getElementById('crop-file-input').click();
}

function _cropFileSelected(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const img = document.getElementById('crop-src-img');
  const url = URL.createObjectURL(file);
  img.onload = () => {
    _cropNatW = img.naturalWidth;
    _cropNatH = img.naturalHeight;
    _cropMinScale = Math.max(CROP_VW / _cropNatW, CROP_VH / _cropNatH);
    _cropScale = _cropMinScale;
    _cropX = (CROP_VW - _cropNatW * _cropScale) / 2;
    _cropY = (CROP_VH - _cropNatH * _cropScale) / 2;
    _clampCrop();
    _applyCropTransform();
    const sl = document.getElementById('crop-zoom-slider');
    sl.min = _cropMinScale; sl.max = _cropMinScale * 4; sl.value = _cropScale;
    _updateCropPreview();
    document.getElementById('crop-modal').style.display = 'flex';
  };
  img.src = url;
}

function _clampCrop() {
  const iw = _cropNatW * _cropScale, ih = _cropNatH * _cropScale;
  _cropX = Math.min(0, Math.max(CROP_VW - iw, _cropX));
  _cropY = Math.min(0, Math.max(CROP_VH - ih, _cropY));
}

function _applyCropTransform() {
  document.getElementById('crop-src-img').style.transform =
    `translate(${_cropX}px,${_cropY}px) scale(${_cropScale})`;
}

function _updateCropPreview() {
  const canvas = document.getElementById('crop-preview-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const img = document.getElementById('crop-src-img');
  const inv = 1 / _cropScale;
  ctx.drawImage(img, -_cropX * inv, -_cropY * inv,
    CROP_VW * inv, CROP_VH * inv, 0, 0, 64, 80);
}

function _cropZoom(e) {
  const prev = _cropScale;
  _cropScale = parseFloat(e.target.value);
  // 중앙 기준으로 줌
  const cx = CROP_VW / 2, cy = CROP_VH / 2;
  _cropX = cx - (cx - _cropX) * (_cropScale / prev);
  _cropY = cy - (cy - _cropY) * (_cropScale / prev);
  _clampCrop();
  _applyCropTransform();
  _updateCropPreview();
}

function _cropDragStart(e) {
  _cropDragging = true;
  _cropLast = { x: e.clientX, y: e.clientY };
}
function _cropDragMove(e) {
  if (!_cropDragging || !_cropLast) return;
  _cropX += e.clientX - _cropLast.x;
  _cropY += e.clientY - _cropLast.y;
  _cropLast = { x: e.clientX, y: e.clientY };
  _clampCrop(); _applyCropTransform(); _updateCropPreview();
}
function _cropDragEnd() { _cropDragging = false; _cropLast = null; }

function _cropTouchStart(e) {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    _cropPinchDist = Math.hypot(dx, dy);
  } else {
    _cropLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}
function _cropTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const ratio = dist / _cropPinchDist;
    const prev = _cropScale;
    _cropScale = Math.min(Math.max(_cropMinScale, _cropScale * ratio), _cropMinScale * 4);
    const cx = CROP_VW / 2, cy = CROP_VH / 2;
    _cropX = cx - (cx - _cropX) * (_cropScale / prev);
    _cropY = cy - (cy - _cropY) * (_cropScale / prev);
    _cropPinchDist = dist;
    document.getElementById('crop-zoom-slider').value = _cropScale;
  } else if (_cropLast) {
    _cropX += e.touches[0].clientX - _cropLast.x;
    _cropY += e.touches[0].clientY - _cropLast.y;
    _cropLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  _clampCrop(); _applyCropTransform(); _updateCropPreview();
}
function _cropTouchEnd() { _cropLast = null; }

async function _cropConfirm() {
  const canvas = document.createElement('canvas');
  canvas.width = CROP_OUT_W; canvas.height = CROP_OUT_H;
  const ctx = canvas.getContext('2d');
  const img = document.getElementById('crop-src-img');
  const inv = 1 / _cropScale;
  ctx.drawImage(img,
    -_cropX * inv, -_cropY * inv, CROP_VW * inv, CROP_VH * inv,
    0, 0, CROP_OUT_W, CROP_OUT_H);
  // WebP: 투명도 유지 + JPEG보다 작은 용량. 미지원 시 흰 배경 JPEG로 폴백
  let dataUrl = canvas.toDataURL('image/webp', 0.82);
  if (!dataUrl.startsWith('data:image/webp')) {
    const fb = document.createElement('canvas');
    fb.width = CROP_OUT_W; fb.height = CROP_OUT_H;
    const fbx = fb.getContext('2d');
    fbx.fillStyle = '#fff';
    fbx.fillRect(0, 0, CROP_OUT_W, CROP_OUT_H);
    fbx.drawImage(canvas, 0, 0);
    dataUrl = fb.toDataURL('image/jpeg', 0.82);
  }
  const kb = Math.round(dataUrl.length * 0.75 / 1024);
  if (_cropIdx >= 0 && INSTRUCTORS_DATA[_cropIdx]) {
    INSTRUCTORS_DATA[_cropIdx].photo = dataUrl;
    showToast(`사진 저장 완료 (${kb}KB)`);
    closeCropModal();
    renderInstructorsPage();
    saveInstData();
  }
}

function closeCropModal() {
  document.getElementById('crop-modal').style.display = 'none';
  const img = document.getElementById('crop-src-img');
  if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  img.src = '';
  _cropIdx = -1;
}

async function uploadToStorage(file, prefix) {
  if (!storage) {
    loadStorageSDK();
    throw new Error('Storage 로드 중입니다. 잠시 후 다시 시도해주세요');
  }
  const path = `${prefix}/${Date.now()}_${file.name}`;
  const snap = await storage.ref().child(path).put(file);
  return snap.ref.getDownloadURL();
}

let _emCfg = null, _emData = {}, _emPending = {};

function openEditModal(cfg) {
  _emCfg = cfg; _emData = Object.assign({}, cfg.defaults || {}); _emPending = {};
  document.getElementById('em-title').textContent = cfg.title;
  const body = document.getElementById('em-body');
  body.innerHTML = cfg.fields.map(f => {
    const val = (_emData[f.key] ?? '');
    let inp = '';
    if (f.type === 'textarea') {
      inp = `<textarea id="emf-${f.key}" rows="${f.rows||4}">${val.replace(/</g,'&lt;')}</textarea>`;
    } else if (f.type === 'select') {
      const opts = (f.options||[]).map(o =>
        `<option value="${o.value}"${o.value===val?' selected':''}>${o.label}</option>`).join('');
      inp = `<select id="emf-${f.key}">${opts}</select>`;
    } else if (f.type === 'file-drop') {
      const prev = val ? `<img src="${val}" onerror="this.style.display='none'">` : '';
      inp = `<div class="file-drop-zone" id="emf-drop-${f.key}"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="_emHandleDrop(event,'${f.key}')">
        <div class="file-drop-preview" id="emf-prev-${f.key}">${prev}</div>
        <p>${val ? '변경: 드래그하거나 파일 선택 · Ctrl+V' : '드래그 또는 Ctrl+V로 붙여넣기'}</p>
        <button class="file-drop-btn" type="button" onclick="_emClickFile('${f.key}')">파일 선택</button>
        <input type="file" id="emf-file-${f.key}" accept="image/*" style="display:none"
               onchange="_emHandleFile(event,'${f.key}')">
      </div>`;
    } else {
      const safe = String(val).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
      inp = `<input type="text" id="emf-${f.key}" value="${safe}" placeholder="${f.placeholder||''}">`;
    }
    const hint = f.hint ? `<p class="field-hint">${f.hint}</p>` : '';
    return `<div class="modal-field"><label>${f.label}</label>${inp}${hint}</div>`;
  }).join('');
  document.getElementById('em-save').onclick = _emSave;
  document.getElementById('edit-modal').style.display = 'flex';
  const first = body.querySelector('input[type="text"],textarea');
  if (first) setTimeout(() => first.focus(), 60);
}

function closeEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
  _emCfg = null; _emData = {}; _emPending = {};
}

function _emClickFile(key) { document.getElementById('emf-file-'+key)?.click(); }

function _emHandleFile(e, key) {
  const file = e.target.files[0];
  if (file) _emPreview(key, file);
}

function _emHandleDrop(e, key) {
  e.preventDefault();
  document.getElementById('emf-drop-'+key)?.classList.remove('drag-over');
  const file = Array.from(e.dataTransfer.files).find(f => f.type.startsWith('image/'));
  if (file) _emPreview(key, file);
}

function _emPreview(key, file) {
  _emPending[key] = file;
  const r = new FileReader();
  r.onload = ev => {
    const el = document.getElementById('emf-prev-'+key);
    if (el) el.innerHTML = `<img src="${ev.target.result}">`;
  };
  r.readAsDataURL(file);
}

async function _emSave() {
  if (!_emCfg) return;
  _emCfg.fields.forEach(f => {
    if (f.type === 'file-drop') return;
    const el = document.getElementById('emf-'+f.key);
    if (el) _emData[f.key] = el.value;
  });
  try {
    for (const [key, file] of Object.entries(_emPending)) {
      showToast('이미지 처리 중...');
      try {
        _emData[key] = await uploadToStorage(file, 'uploads');
      } catch(err) { showToast(err.message, 'error'); return; }
    }
    _emCfg.fields.filter(f => f.type==='file-drop').forEach(f => {
      if (!_emPending[f.key]) _emData[f.key] = _emCfg.defaults?.[f.key] || '';
    });
    const onSave = _emCfg.onSave;
    const data = Object.assign({}, _emData);
    onSave(data);
  } finally {
    closeEditModal();
  }
}

// Ctrl+V 이미지 붙여넣기 (편집 팝업 열려있을 때)
document.addEventListener('paste', e => {
  if (document.getElementById('edit-modal')?.style.display === 'none') return;
  const imgItem = Array.from(e.clipboardData?.items||[]).find(i => i.type.startsWith('image/'));
  if (!imgItem) return;
  const ff = _emCfg?.fields?.find(f => f.type === 'file-drop');
  if (!ff) return;
  const file = imgItem.getAsFile();
  if (file) _emPreview(ff.key, file);
});
function shiftSubNav(navId, dir) {
  const nav = document.getElementById(navId);
  if (!nav) return;
  nav.scrollBy({ left: dir * 200, behavior: 'smooth' });
  setTimeout(() => updateSubNavArrows(navId), 320);
}
function updateSubNavArrows(navId) {
  const nav = document.getElementById(navId);
  if (!nav) return;
  const prev = document.getElementById(navId + '-prev');
  const next = document.getElementById(navId + '-next');
  if (prev) prev.disabled = nav.scrollLeft <= 2;
  if (next) next.disabled = nav.scrollLeft + nav.clientWidth >= nav.scrollWidth - 2;
}

function renderSubNavs() {
  const ids    = DEPT_ORDER;
  const addBtn = isEditMode ? `<button class="admin-add-course-btn" onclick="addCourse()">+ 강좌 추가</button>` : '';
  const btns   = ids.filter(id => COURSES[id]).map(id => `<button class="sub-nav__btn" data-course="${id}"${isEditMode ? ` draggable="true" data-dept="${id}"` : ''}>${isEditMode ? `<span class="dept-drag-handle">⠿</span>` : ''}${COURSES[id].label}</button>`).join('') + addBtn;
  // 로드맵은 2호선 노선도 이미지로 교체됨(학과 탭 없음) — 요소가 없으면 건너뜀
  const rmNav = document.getElementById('roadmap-subnav');
  if (rmNav) rmNav.innerHTML = btns;
  document.getElementById('curr-subnav').innerHTML       = btns;
  document.getElementById('checklist-subnav').innerHTML  = btns;
  ['roadmap-subnav','curr-subnav','checklist-subnav'].forEach(id => {
    const nav = document.getElementById(id);
    if (!nav) return;
    nav.removeEventListener('scroll', nav._arrUpd);
    nav._arrUpd = () => updateSubNavArrows(id);
    nav.addEventListener('scroll', nav._arrUpd, { passive: true });
    updateSubNavArrows(id);
  });
  // 스와이프 제스처: 콘텐츠 영역을 좌우로 밀면 학과 탭 이동
  [
    ['roadmap-views',   'roadmap-subnav'],
    ['curr-views',      'curr-subnav'],
    ['checklist-views', 'checklist-subnav'],
  ].forEach(([viewsId, navId]) => addSwipeNav(viewsId, navId));
}

function addSwipeNav(viewsId, navId) {
  const el = document.getElementById(viewsId);
  if (!el || el._swipeInit) return;
  el._swipeInit = true;
  let sx, sy;
  el.addEventListener('touchstart', e => {
    // 가로 스크롤 박스(이미지 갤러리·표 등) 안에서 시작한 터치는 그 박스 스크롤용 → 탭 이동 안 함
    for (let n = e.target; n && n !== el; n = n.parentElement) {
      const ox = getComputedStyle(n).overflowX;
      if (ox === 'auto' || ox === 'scroll') {
        sx = sy = null;
        return;
      }
    }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    sx = sy = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    const nav = document.getElementById(navId);
    if (!nav) return;
    const btns = [...nav.querySelectorAll('.sub-nav__btn')];
    const active = nav.querySelector('.sub-nav__btn.is-active');
    const idx = btns.indexOf(active);
    const next = dx < 0 ? idx + 1 : idx - 1;
    if (next >= 0 && next < btns.length) btns[next].click();
  }, { passive: true });
}

const RMAP_DEFAULT = {};   // 글씨 번호 → 기본 글씨(그릴 때 채움)

// 기본 글씨와 같으면 저장하지 않음(바꾼 글씨만 남김)
function setRoadmapText(k, v) {
  if (!(k in RMAP_DEFAULT)) return;
  v = v.replace(/\u00a0/g, ' ');   // 화면용 붙는 공백은 저장하지 않음
  const map = UI_DATA.roadmapMap;
  if (v === RMAP_DEFAULT[k]) {
    if (map && k in map) { delete map[k]; if (!Object.keys(map).length) delete UI_DATA.roadmapMap; }
    return;
  }
  (UI_DATA.roadmapMap ||= {})[k] = v;
}

// 꺾이는 곳을 둥글게 이은 선
function rmPath(pts, r) {
  const p = pts.filter((q, i) => i === 0 || Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1]) > 0.5);
  const f = v => Math.round(v * 10) / 10;
  let d = `M${f(p[0][0])},${f(p[0][1])}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    d += `L${f(x1 + (x0 - x1) / l1 * rr)},${f(y1 + (y0 - y1) / l1 * rr)}`
       + `Q${f(x1)},${f(y1)} ${f(x1 + (x2 - x1) / l2 * rr)},${f(y1 + (y2 - y1) / l2 * rr)}`;
  }
  const e = p[p.length - 1];
  return d + `L${f(e[0])},${f(e[1])}`;
}

const rmEsc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 글씨 번호(k)의 지금 글씨(고친 글씨가 있으면 그것)
function rmText(k, def) {
  RMAP_DEFAULT[k] = def;
  const map = UI_DATA.roadmapMap || {};
  return k in map ? map[k] : def;
}
// 글씨 한 칸: editable 이면 편집 모드에서 바로 고침
function rmT(k, def, cls, style = '', attrs = '', editable = true) {
  let t = rmText(k, def);
  if (/\b(rm-d|rmd__d)\b/.test(cls)) t = t.replace(/ · /g, '\u00a0· ');   // 줄이 바뀌어도 '·'는 줄 끝에
  const ed = editable && isEditMode ? ` contenteditable="true" spellcheck="false" data-path="ui.roadmapMap.${k}"` : '';
  return `<div class="${cls}"${style ? ` style="${style}"` : ''}${attrs}${ed}>${rmEsc(t)}</div>`;
}

// 평일·주말 시간표에 아직 없는 과정 = 신설 예정역(점선). 개설되면 여기서 이름만 빼면 일반 역으로 돌아감
const RMAP_SOON = new Set([]);   // 11/24: 신설 예정 13개 역 모두 일반 역으로 전환(로드맵 표시 없음)
const rmSoon = name => RMAP_SOON.has(String(name).replace(/\u200b/g, ''));
function renderRoadmapMap() {
  const box = document.getElementById('rmap-texts'), svgBox = document.getElementById('rmap-svg');
  if (!box || !svgBox) return;
  const esc = rmEsc;
  const T = (k, def, cls, style = '', attrs = '') => rmT(k, def, cls, style, attrs, true);    // 제목·범례·아래 칸
  const V = (k, def, cls, style = '', attrs = '') => rmT(k, def, cls, style, attrs, false);   // 노선·순환선(상세 화면에서 고침)
  const W = RMAP_W, H = RMAP_H, cx = W / 2;
  const ROW_TOP = 128, ROW_BOT = H - 134;  // 첫 줄·마지막 줄 노선 높이(제목은 왼쪽 위, 범례는 오른쪽 위 머리줄)
  const CONN_TOP = 226, CONN_BOT = 690;     // 순환선에 붙는 오른쪽 줄들이 고르게 놓이는 높이(갈라진 줄은 맨 위·맨 아래)
  // 가운데 순환선 = 모서리가 둥근 사각형. 맨 위 줄(ROW_TOP)까지 옆면이 닿게 → 모든 노선이 옆면에 바로 수평으로 붙음
  const HW = 150, RC = 28;                   // 가운데에서 옆면까지, 모서리 반지름
  const LT = ROW_TOP - RC - 6, LB = CONN_BOT + RC + 6;   // 위·아래 변 높이
  const cy = (LT + LB) / 2;
  const EDGE_X = HW - RC - 16;            // 옆면 높이 밖의 노선은 위·아래 변(가운데에서 이 거리)에서 나와 꺾임
  const COL_IN = cx + 212, COL_OUT = W - 56;   // 오른쪽 역 칸(왼쪽은 좌우 대칭)
  // 역 사이 간격: 과정이 가장 많은 노선이 COL_IN~COL_OUT 를 꽉 채우는 간격(모든 노선 공통)
  const MAXN = Math.max(...[...RMAP.left, ...RMAP.right].filter(r => !r.from).map(r => r.st.length));
  const STEP = (COL_OUT - COL_IN) / Math.max(1, MAXN - 1);
  const CORNER = 20;
  const html = [];
  const lines = [], dots = [], loopDots = [];

  const rows = {};
  const place = (list, s) => {
    const xin = s > 0 ? COL_IN : W - COL_IN, xout = s > 0 ? COL_OUT : W - COL_OUT;
    // 줄 높이: 맨 위·맨 아래가 갈라져 나온 줄이면 그 줄은 맨 끝에, 나머지는 순환선 옆면 높이 안에 고르게
    // (→ 순환선에 붙는 줄은 모두 옆면에 곧게 붙음). 아니면 위에서 아래까지 고르게
    const n0 = list[0].from ? 1 : 0, n1 = list[list.length - 1].from ? 1 : 0;
    const top = n0 ? CONN_TOP : ROW_TOP, bot = n1 ? CONN_BOT : ROW_BOT, mid = list.length - n0 - n1;
    list.forEach((row, k) => {
      row._s = s;
      if (n0 && k === 0) row._y = ROW_TOP;
      else if (n1 && k === list.length - 1) row._y = ROW_BOT;
      else row._y = mid > 1 ? top + (bot - top) * (k - n0) / (mid - 1) : (top + bot) / 2;
      rows[row.id] = row;
    });
    // align 이 있는 줄: 맞은편 노선(들) 높이에 맞춤(여럿이면 그 가운데). 나머지 줄은 맞춘 줄 사이에 고르게
    if (list.some(r => r.align)) {
      const fixed = list.map((r, k) => r.y != null ? r.y : r.align ? r.align.reduce((a, id) => a + rows[id]._y, 0) / r.align.length
        : k === 0 ? ROW_TOP : k === list.length - 1 ? ROW_BOT : null);
      list.forEach((r, k) => {
        if (fixed[k] != null) { r._y = fixed[k]; return; }
        let a = k - 1, b = k + 1;
        while (fixed[a] == null) a--;
        while (fixed[b] == null) b++;
        r._y = fixed[a] + (fixed[b] - fixed[a]) * (k - a) / (b - a);
      });
    }
    // 역 간격은 모든 노선이 같음(가장 긴 노선이 끝까지) → 과정 수가 적은 노선은 종점이 순환선 가까이
    // 갈라져 나온 줄(from)은 부모 줄 역 위치를 쓰므로 나중에
    [...list.filter(r => !r.from), ...list.filter(r => r.from)].forEach(row => {
      if (row.from) {
        const px = rows[row.from[0]]._x, start = row.from[1] + 1, last = px.length - 1;
        row._x = row.st.map((_, i) => px[start + i] ?? px[last] + s * STEP * (start + i - last));
      } else {
        row._x = row.st.map((_, i) => xin + s * STEP * (i + (row.offset || 0)));
      }
    });
    // 순환선에 붙는 자리: 옆면(바로 수평) 또는 위·아래 변(꺾어서)
    list.filter(r => !r.from).forEach(row => {
      const y = row._y;
      if (y >= LT + RC + 6 && y <= LB - RC - 6) { row._ax = cx + s * HW; row._ay = y; }
      else { row._ax = row._lx = cx + s * (row.drop ?? EDGE_X); row._ay = y < cy ? LT : LB; }
    });
  };
  place(RMAP.right, 1);    // 오른쪽 먼저(왼쪽 줄이 오른쪽 높이에 맞추므로)
  place(RMAP.left, -1);

  const all = [...RMAP.left, ...RMAP.right];
  // 1) 선
  all.forEach(row => {
    const y = row._y, xs = row._x;
    if (row.solo) {
      // 공통기초 없이 바로 시작하는 노선: 순환선에 잇지 않고 첫 역에서 출발
    } else if (!row.from) {
      const pts = [[row._ax, row._ay]];
      if (row._lx != null) pts.push([row._lx, y]);
      pts.push([xs[0], y]);
      lines.push({ d: rmPath(pts, CORNER), c: row.feed || row.color });
      loopDots.push([row._ax, row._ay]);
    } else {
      const par = rows[row.from[0]], px = par._x[row.from[1]], py = par._y;
      lines.push({ d: rmPath([[px, py], [px, y], [xs[0], y]], CORNER), c: row.color });
    }
    for (let i = 1; i < xs.length; i++) {
      const dash = 'xr'.includes(row.st[i][2]);
      lines.push({ d: `M${xs[i - 1]},${y}L${xs[i]},${y}`, c: row.color, dash });
    }
  });
  // 2) 역 점
  const dot = (x, y, t, c, inner) => {
    const f = v => Math.round(v * 10) / 10;
    x = f(x); y = f(y);
    if (t === 'g') return `<circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="${c}" stroke-width="4"/>`;
    if (t === 'a') return `<circle cx="${x}" cy="${y}" r="10" fill="#ecfdf5" stroke="${c}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4.2" fill="#059669"/>`;
    if (t === 'p') return `<circle cx="${x}" cy="${y}" r="11" fill="#0f172a" stroke="${c}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="3.6" fill="#fff"/>`;
    if (t === 'x') return `<circle cx="${x}" cy="${y}" r="10.5" fill="#ecfdf5" stroke="#059669" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4.6" fill="#059669"/>`;
    if (t === 'b') return `<circle cx="${x}" cy="${y}" r="10.5" fill="#a21caf" stroke="#a21caf" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4.4" fill="#fff"/>`;
    if (t === 'r') return `<circle cx="${x}" cy="${y}" r="10.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4.6" fill="#7c3aed"/>`;
    return `<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#0f172a" stroke-width="4.5"/><circle cx="${x}" cy="${y}" r="6" fill="${inner}"/>`;
  };
  // 3) 역 점 + 점 아래 과정명 + 노선 이름표(누르면 그 노선 상세). 줄 둘레 넓은 칸도 누르면 열림
  const LBL_W = Math.round(STEP - 6);
  const kids = {};   // 아래로 갈라지는 역(인테리어 AI캐드) → 이름을 점 위에
  all.forEach(row => { if (row.from) (kids[row.from[0] + '_' + row.from[1]] ||= []).push(row); });
  all.forEach(row => {
    const y = row._y, xs = row._x;
    xs.forEach((x, i) => {
      const [name, , t] = row.st[i], key = `${row.id}_${i}`;
      const soon = rmSoon(name);
      const sx = Math.round(x * 10) / 10, sy = Math.round(y * 10) / 10;
      dots.push(soon ? `<circle cx="${sx}" cy="${sy}" r="${t === 'b' ? 10 : 8.5}" fill="${t === 'b' ? '#fdf4ff' : '#fff'}" stroke="${row.color}" stroke-width="3.5" stroke-dasharray="3.6 3"/>`
        + (t === 'b' ? `<circle cx="${sx}" cy="${sy}" r="4" fill="#a21caf"/>` : '')
        : dot(x, y, t, row.color, (i === 0 && row.feed) ? row.feed : row.color));
      const up = (kids[key] || []).some(k => k._y > y);
      html.push(`<div class="rm-st rm-st--${t}${soon ? ' rm-st--soon' : ''}${up ? ' rm-st--up' : ''}" style="left:${x}px;top:${up ? y - 14 : y + 14}px;width:${LBL_W}px`
        + (up ? ';transform:translate(-50%,-100%)' : '') + `">` + V(key + '_n', name, 'rm-n') + `</div>`);
    });
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    html.push(`<div class="rm-hit" data-line="${row.id}" style="left:${x0 - LBL_W / 2}px;top:${y - 44}px;width:${x1 - x0 + LBL_W}px;height:92px"></div>`);
    // 왼쪽 노선은 순환선에서 바깥(왼쪽)으로 뻗으므로 이름표도 '‹ 이름 ●'(화살표가 바깥, 점이 순환선 쪽)
    // 바로 시작 노선: 첫 역 위에 표시 + 이름표는 그 표시를 피해 둘째 역~끝 가운데
    const pillX = row.solo ? (xs[1] + xs[xs.length - 1]) / 2 : (x0 + x1) / 2;
    if (row.solo) html.push(V('solo_tag', RMAP.soloTag, 'rm-solo', `left:${xs[0]}px;top:${y - 15}px;--c:${row.color}`));
    html.push(V(row.id + '_label', row.label, 'rm-pill' + (row._s < 0 ? ' rm-pill--l' : ''), `left:${pillX}px;top:${y - 13}px;--c:${row.color}${row.ink ? `;--ci:${row.ink}` : ''}`,
      ` data-line="${row.id}" role="button" tabindex="0"`));
  });

  // 4) 가운데 순환선(모서리가 둥근 사각형) — CORE 상자 3개는 사각형 안쪽
  const hub = RMAP.hub;
  const boxW = 134, boxH = 56;
  const cores = [[cx, LT], [cx - 70, LB], [cx + 70, LB]];
  const boxX = [cx, cx - 70, cx + 70], boxY = [LT + 28, LB - 28 - boxH, LB - 28 - boxH];
  const rr = pad => `x="${cx - HW - pad}" y="${LT - pad}" width="${2 * (HW + pad)}" height="${LB - LT + 2 * pad}" rx="${RC + pad}"`;
  const dashLine = (x, y1, y2) => `<path d="M${x},${y1}V${y2}" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="4 4" fill="none"/>`;
  const hubSvg = [
    `<rect ${rr(16)} fill="#f0fdf4" stroke="#86efac" stroke-width="1.6" stroke-dasharray="5 6"/>`,
    `<rect ${rr(0)} fill="#fff" stroke="#16a34a" stroke-width="18"/>`,
    `<rect ${rr(0)} fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="9 9" opacity=".9"/>`,
    dashLine(cx, LT + 12, boxY[0]),
    dashLine(cx - 70, LB - 12, boxY[1] + boxH),
    dashLine(cx + 70, LB - 12, boxY[2] + boxH),
    `<circle cx="${cx}" cy="${cy - 58}" r="32" fill="#16a34a"/>`,
  ];
  loopDots.forEach(([x, y]) => hubSvg.push(`<circle cx="${x}" cy="${y}" r="5.2" fill="#fff" stroke="#0f172a" stroke-width="2.6"/>`));
  cores.forEach(([x, y]) => hubSvg.push(`<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#0f172a" stroke-width="5"/><circle cx="${x}" cy="${y}" r="6" fill="#16a34a"/>`));
  html.push(`<div class="rm-hit rm-hit--hub" data-line="hub" role="button" tabindex="0" aria-label="공통기초 순환선 자세히 보기" style="left:${cx - HW - 9}px;top:${LT - 9}px;width:${2 * HW + 18}px;height:${LB - LT + 18}px"></div>`);
  html.push(V('hub_num', hub.num, 'rm-hnum', `left:${cx}px;top:${cy - 58}px`));
  html.push(V('hub_tag', hub.tag, 'rm-htag', `left:${cx}px;top:${cy - 6}px`));
  html.push(V('hub_name', hub.name, 'rm-hname', `left:${cx}px;top:${cy + 10}px`));
  // 순환선 설명은 사각형 안이 넉넉해서 전체 보기에서도 보이게
  html.push(`<div class="rm-hdesc" style="left:${cx}px;top:${cy + 50}px">` + V('hub_d1', hub.d1, 'rm-hd') + V('hub_d2', hub.d2, 'rm-hd') + `</div>`);
  // '순환' 표시: 위 변 좌우 + 아래 변 가운데
  // (아래 변 가운데에서 노선이 나가면 그 자리는 비움)
  const bottomMidUsed = all.some(r => r.drop === 0);
  [[cx - 64, LT], [cx + 64, LT], [cx, LB]]
    .forEach(([x, y], i) => { if (!(i === 2 && bottomMidUsed)) html.push(V('hub_loop' + i, hub.loop, 'rm-loop', `left:${x}px;top:${y}px`)); });
  hub.cores.forEach((c, i) => {
    // 키워드(kw)가 있는 상자는 이름 아래에 키워드 줄 + 칸을 넓게(위 CORE 01은 혼자라 자리 넉넉)
    const w = c.kw ? 176 : boxW;
    html.push(`<div class="rm-core" style="left:${boxX[i]}px;top:${boxY[i]}px;width:${w}px;min-height:${boxH}px">`
      + V(c.k + '_tag', c.tag, 'rm-core__tag') + V(c.k + '_name', c.name, 'rm-core__name')
      + (c.kw ? V(c.k + '_kw', c.kw, 'rm-core__kw') : '') + V(c.k + '_desc', c.desc, 'rm-d rm-core__desc') + `</div>`);
  });

  // 5) 머리말·범례·아래 칸
  html.push(`<div class="rm-bar"></div>`);
  html.push(`<div class="rm-head">` + T('title', RMAP.title, 'rm-title') + T('sub', RMAP.sub, 'rm-sub') + `</div>`);
  html.push(`<div class="rm-legend">` + RMAP.legend.map(([t, label], i) =>
    `<div class="rm-lg"><i class="rm-lg__dot rm-lg__dot--${t}"></i>${T('lg' + i, label, 'rm-lg__t')}</div>`).join('') + `</div>`);
  const f = RMAP.foot;
  html.push(`<div class="rm-foot">` + T('f_center', f.center, 'rm-foot__pill')
    + f.certs.map(([n, d, c], i) => `<div class="rm-cert" style="--c:${c}">` + T(`f${i}_n`, n, 'rm-cert__n') + T(`f${i}_d`, d, 'rm-cert__d') + `</div>`).join('')
    + `<div class="rm-brand">` + T('f_brand', f.brand, 'rm-brand__n') + T('f_branch', f.branch, 'rm-brand__b') + `</div></div>`);

  svgBox.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgBox.setAttribute('width', W); svgBox.setAttribute('height', H);
  svgBox.innerHTML =
    lines.filter(l => l.dash).map(l => `<path d="${l.d}" stroke="${l.c}" stroke-width="6" stroke-dasharray="1 11" stroke-linecap="round" fill="none"/>`).join('')
    + lines.filter(l => !l.dash).map(l => `<path d="${l.d}" stroke="${l.c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`).join('')
    + hubSvg.join('') + dots.join('');
  box.innerHTML = html.join('');
  renderRoadmapDetail();
}

/* 노선 상세: 노선(또는 가운데 순환선)을 누르면 그 노선만 큰 글씨로 — 순환선에서 출발해 역 순서대로 */
let rmapOpen = null;   // 열려 있는 상세: 노선 id 또는 'hub'
const rmRows = () => [...RMAP.left, ...RMAP.right];
// 순환선에서 이 노선 끝까지 지나는 역(갈라져 나온 노선은 갈라지는 역까지 부모 노선을 지남)
function rmRoute(id) {
  const row = rmRows().find(r => r.id === id);
  if (!row) return [];
  let route = [];
  if (row.from) {
    const pr = rmRoute(row.from[0]);
    route = pr.slice(0, pr.findIndex(s => s.row.id === row.from[0] && s.i === row.from[1]) + 1);
  }
  row.st.forEach((st, i) => route.push({ row, i, st, color: (i === 0 && !row.from) ? (row.feed || row.color) : row.color, dash: 'xr'.includes(st[2]) }));
  return route;
}
function renderRoadmapDetail() {
  const wrap = document.getElementById('rmap'), box = document.getElementById('rmap-detail');
  if (!wrap || !box) return;
  if (rmapOpen !== 'hub' && !rmRows().some(r => r.id === rmapOpen)) rmapOpen = null;
  wrap.classList.toggle('is-open', !!rmapOpen);
  box.hidden = !rmapOpen;
  box.innerHTML = rmapOpen ? rmDetailHtml(rmapOpen, false) : '';
}
// 노선 상세 화면 마크업. pdf=true 면 버튼 없이·고칠 수 없게·사진 바로 불러오기
function rmDetailHtml(id, pdf) {
  const hub = RMAP.hub, row = rmRows().find(r => r.id === id);
  const T = pdf ? (k, d, c, s = '', a = '') => rmT(k, d, c, s, a, false) : rmT;
  const seg = (c, dash) => `<span class="rmd__seg${dash ? ' rmd__seg--dash' : ''}" style="--sc:${c}"></span>`;
  const col = (line, top, mark, name, desc) =>
    `<div class="rmd__col">${line}<div class="rmd__slot">${top}</div><div class="rmd__mark">${mark}</div>${name}${desc}</div>`;
  const dot = (t, lc, inner) => `<span class="rmd__dot rmd__dot--${t}" style="--lc:${lc};--in:${inner}"></span>`;
  let head, cols, color, go = '';
  if (id === 'hub') {
    color = '#16a34a';
    head = `<div class="rmd__title"><span class="rmd__num">${rmEsc(rmText('hub_num', hub.num))}</span>${T('hub_name', hub.name, 'rmd__name')}</div>`
      + T('hub_d2', hub.d2, 'rmd__sub');
    cols = ['c1', 'c2', 'c3'].map(k => hub.cores.find(c => c.k === k)).map((c, i) =>
      col(i ? seg(color) : '', T(c.k + '_tag', c.tag, 'rmd__badge rmd__badge--core'), dot('t', '#0f172a', '#16a34a'),
        T(c.k + '_name', c.name, 'rmd__n') + (c.kw ? T(c.k + '_kw', c.kw, 'rmd__kw') : ''), T(c.k + '_desc', c.desc, 'rmd__d')));
  } else {
    color = row.color;
    const dept = row.dept && COURSES[row.dept] ? row.dept : '';
    if (dept) go = `<button type="button" class="rmd__go" data-dept="${dept}" aria-label="${rmEsc(COURSES[dept].label || '')} 상세 커리큘럼 보기">상세 커리큘럼 보기<span aria-hidden="true">›</span></button>`;
    head = `<div class="rmd__title">${T(row.id + '_label', row.label, 'rmd__name')}</div>`;
    // 바로 시작 노선은 공통기초 칸 없이 첫 역부터
    cols = (row.solo ? [] : [col('', '', `<span class="rmd__hub">${rmEsc(rmText('hub_num', hub.num))}</span>`,
      T('hub_name', hub.name, 'rmd__n'), T('hub_d1', hub.d1, 'rmd__d'))])
      .concat(rmRoute(row.id).map(({ row: r, i, st: [name, desc, t, badge], color: c, dash }, n) => {
        const key = `${r.id}_${i}`, b = badge || (t === 'p' ? 'PO·완성' : '');
        const first = row.solo && n === 0, soon = rmSoon(name);
        const top = soon ? T('soon_tag', RMAP.soonTag, 'rmd__badge rmd__badge--soon')
          : first ? T('solo_tag', RMAP.soloTag, 'rmd__badge rmd__badge--start')
          : b ? T(key + '_b', b, `rmd__badge rmd__badge--${t === 'p' ? 'po' : t === 'r' ? 'rv' : t === 'b' ? 'biz' : 'ai'}`) : '';
        return col(first ? '' : seg(c, dash), top,
          soon ? dot(t === 'b' ? 'sb' : 's', r.color, r.color) : dot(t, r.color, (i === 0 && r.feed) ? r.feed : r.color), T(key + '_n', name, 'rmd__n'), T(key + '_d', desc, 'rmd__d'));
      }));
  }
  const ex = row ? (RMAP_EX[row.id] || []) : [];
  const exHtml = ex.length ? `<section class="rmd__ex">${T('ex_title', '결과물 예시', 'rmd__ex-h')}<div class="rmd__ex-grid">`
    + ex.slice(0, 4).map(([f, by]) => `<figure class="rmd__ex-fig"><img src="images/roadmap-ex/${f}" alt=""${pdf ? '' : ' loading="lazy"'} decoding="async">`
      + `<figcaption>참고 사진 · ${rmEsc(by)} / Unsplash</figcaption></figure>`).join('') + `</div></section>` : '';
  return `<div class="rmd" style="--c:${color}${row?.ink ? `;--ci:${row.ink}` : ''}">`
    + (pdf ? '' : `<div class="rmd__bar"><button type="button" class="rmd__back"><span aria-hidden="true">‹</span>전체 노선도</button>${go}</div>`)
    + `<div class="rmd__head">${head}</div>`
    + `<div class="rmd__body"><div class="rmd__route" data-n="${cols.length}" style="--n:${cols.length}">${cols.join('')}</div>${exHtml}</div>`
    + `<div class="rmd__legend">` + RMAP.legend.map(([t, label], i) =>
        `<div class="rm-lg"><i class="rm-lg__dot rm-lg__dot--${t}"></i><span class="rm-lg__t">${rmEsc(rmText('lg' + i, label))}</span></div>`).join('') + `</div>`
    + `</div>`;
}
// 편집 모드: 노선도 글씨는 치는 즉시 저장 목록(UI_DATA.roadmapMap)에 반영 → 상세에서 고친 역 이름·노선 이름이
// 전체 노선도·PDF에도 바로 같이 바뀜(같은 글씨 번호를 함께 씀). 화면 바꾸기 직전에도 한 번 더 반영
function rmFlushEdits() {
  document.querySelectorAll('#rmap [contenteditable="true"][data-path^="ui.roadmapMap."]')
    .forEach(el => setByPath(el.dataset.path, el.innerText.trim()));
}
document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('[contenteditable="true"][data-path^="ui.roadmapMap."]');
  if (el) setByPath(el.dataset.path, el.innerText.trim());
});
function openRoadmapLine(id) {
  rmFlushEdits();
  rmapOpen = id; renderRoadmapDetail();
  const b = document.getElementById('rmap-detail'); if (b) b.scrollTop = 0;
}
function closeRoadmapLine() { rmFlushEdits(); rmapOpen = null; renderRoadmapMap(); }

/* ══════════════════════════════════════════════════
   RENDER: 로드맵 패널 (1개)
══════════════════════════════════════════════════ */
function renderRoadmapView(id) {
  // 2026-11-20 로드맵 섹션을 2호선 노선도 이미지로 교체 — 학과별 단계 화면은 더 이상 그리지 않음(데이터는 유지)
  if (!document.getElementById('roadmap-views')) return;
  const c  = COURSES[id];
  const em = isEditMode;
  const steps = (c.roadmap || []).map((s, si) => `
    <div class="roadmap-step">
      <div class="roadmap-step__line">
        <div class="roadmap-step__dot">${s.phase || String(si+1).padStart(2,'0')}</div>
        <div class="roadmap-step__connector"></div>
      </div>
      <div class="roadmap-step__body">
        <p class="roadmap-step__title">${em ? E('courses.'+id+'.roadmap.'+si+'.title', s.title) : s.title}</p>
        <p class="roadmap-step__weeks">${em ? E('courses.'+id+'.roadmap.'+si+'.weeks', s.weeks) : s.weeks}</p>
        ${s.desc ? `<div class="roadmap-step__purpose">${em ? E('courses.'+id+'.roadmap.'+si+'.desc', s.desc) : s.desc}</div>` : (em ? `<div class="roadmap-step__purpose">${E('courses.'+id+'.roadmap.'+si+'.desc', '')}</div>` : '')}
        ${em ? `<div style="margin-top:6px"><button class="admin-del-btn" onclick="deleteRoadmapStep('${id}',${si})">✕ 단계 삭제</button></div>` : ''}
      </div>
    </div>`).join('');

  const introImg  = c.introImg  || '';
  const introText = c.introText || DEPT_INTRO_TEXT[id] || '';
  const hasIntro  = introImg || introText || em;

  const introHTML = hasIntro ? `
    <div class="dept-intro">
      <div class="dept-intro__text">${em
        ? E('courses.'+id+'.introText', introText)
        : introText
      }</div>
      ${introImg ? `
      <div class="dept-intro__img-wrap">
        <img class="dept-intro__img" src="${introImg}" alt="${c.label} 학과소개" loading="lazy">
        ${em ? `<button class="dept-intro__img-edit" onclick="editDeptIntroImg('${id}')">🖼 이미지 변경</button>` : ''}
      </div>` : (em ? `<button class="admin-add-btn" onclick="editDeptIntroImg('${id}')">+ 학과소개 이미지 추가</button>` : '')}
    </div>` : '';

  let el = document.getElementById('rm-'+id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'rm-'+id;
    el.className = 'course-view';
    document.getElementById('roadmap-views').appendChild(el);
  }
  el.innerHTML = `
    ${introHTML}
    <div class="curr-header">
      <h2 class="curr-header__title">${c.label}</h2>
      <div class="curr-header__meta">${c.duration}</div>
    </div>
    <div class="roadmap-steps">${steps || '<p style="color:var(--c-text-2)">로드맵 단계를 추가하세요.</p>'}</div>
    ${em ? `<button class="admin-add-block" onclick="addRoadmapStep('${id}')">+ 단계 추가</button>` : ''}
    ${((() => { const usingDJ = !c.jobs?.length; const jobs = usingDJ ? (DEFAULT_JOBS[id]||[]) : c.jobs; return (jobs.length || em) ? `
    <div class="jobs-section">
      <p class="jobs-section__label">🎯 취업 가능 직종${em && usingDJ ? ' <span style="font-size:var(--t-xs);font-weight:400;color:var(--c-text-3)">(기본값 — 추가 시 커스텀으로 전환)</span>' : ''}</p>
      <div class="job-chips">
        ${jobs.map((j,ji) => `<span class="job-chip">${em && !usingDJ ? E('courses.'+id+'.jobs.'+ji, j) : j}${em && !usingDJ ? `<button class="job-chip__del" onclick="deleteJob('${id}',${ji})">✕</button>` : ''}</span>`).join('')}
        ${em ? `<button class="admin-add-btn" onclick="addJob('${id}')">+ 직종 추가</button>` : ''}
      </div>
    </div>` : ''; })())}
    ${((() => { const usingDO = !c.outcomes?.length; const outs = usingDO ? (DEFAULT_OUTCOMES[id]||[]) : c.outcomes; return (outs.length || em) ? `
    <div class="outcomes-section">
      <p class="outcomes-section__label">이 과정을 마치면${em && usingDO ? ' <span style="font-size:var(--t-xs);font-weight:400;color:var(--c-text-3)">(기본값)</span>' : ''}</p>

  return m ? m[1].replace(/\s*전임\s*$/, '').trim() : '기타';
}

/* 구글 지도 후기: 수강생 후기 화면을 열 때 /api/google-reviews 에서 받아옴.
   구글 약관상 저장하지 않고(서비스워커도 제외), 받은 후기 최대 5개 중 4점 이상만 표시 */
let G_REVIEWS = null, G_REVIEWS_LOADING = false;
function loadGoogleReviews() {
  if (G_REVIEWS || G_REVIEWS_LOADING || location.protocol === 'file:') return;
  G_REVIEWS_LOADING = true; paintGoogleReviews();
  fetch('/api/google-reviews', { cache: 'no-store' })
    .then(r => r.json()).then(d => { G_REVIEWS = d; })
    .catch(() => { G_REVIEWS = { ok: false }; })
    .finally(() => { G_REVIEWS_LOADING = false; paintGoogleReviews(); });
}
function paintGoogleReviews() {
  const el = document.getElementById('g-reviews');
  if (!el) return;
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = u => /^https:\/\//.test(u || '') ? esc(u) : '';
  const d = G_REVIEWS;
  if (!d) { el.innerHTML = G_REVIEWS_LOADING ? '<p class="g-rv__wait">구글 지도 후기를 불러오는 중…</p>' : ''; return; }
  if (!d.ok || !d.rating) { el.innerHTML = ''; return; }   // 불러오지 못하면 칸을 숨김
  const maps = safeUrl(d.mapsUri);
  const cards = (d.reviews || []).map(v => {
    const raw = v.author || '구글 사용자', name = esc(raw), link = safeUrl(v.authorUri), photo = safeUrl(v.photo);
    return `<div class="review-card-v2 g-rv__card" style="--rv-accent:#4285F4">
      <div class="review-card-v2__head">
        ${photo ? `<img class="review-avatar-v2 g-rv__photo" src="${photo}" alt="" referrerpolicy="no-referrer" loading="lazy">` : `<div class="review-avatar-v2">${esc(raw.charAt(0))}</div>`}
        <div><p class="review-card-v2__name">${link ? `<a href="${link}" target="_blank" rel="noopener">${name}</a>` : name}</p>
          <div class="review-card-v2__tags"><span class="rv-tag-course">Google 지도 리뷰</span></div></div>
      </div>
      <p class="review-card-v2__text g-rv__text">${esc(v.text)}</p>
      <div class="review-card-v2__foot"><span class="rv-stars">${'★'.repeat(Math.round(v.rating || 0))}</span><span class="rv-date">${esc(v.when)}</span></div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="g-rv__head">
      <div><p class="g-rv__title">구글 지도 후기</p></div>
      ${maps ? `<a class="g-rv__score" href="${maps}" target="_blank" rel="noopener"><b>★ ${Number(d.rating).toFixed(1)}</b><span>후기 ${Number(d.count || 0).toLocaleString()}개 · 전체 보기 ›</span></a>` : ''}
    </div>
    ${cards ? `<div class="review-grid-v2">${cards}</div>` : ''}
    <p class="g-rv__attr">Google Maps</p>`;
}

function buildExamDDayTable() {
  const today = new Date(); today.setHours(0,0,0,0);

  function getNextInfo(ex) {
    for (const s of ex.sessions) {
      const wd = parseExamDate(s.wExam || s.exam || s.written);
      if (!wd) return { s, status: 'always' };          // 상시
      const rd = parseExamDate(s.result2 || s.result);
      if (wd >= today) {
        const diff = Math.ceil((wd - today) / 86400000);
        return { s, status: 'upcoming', diff };
      }
      if (rd && rd >= today) return { s, status: 'waiting' }; // 결과 대기
      // 완전히 지남 → 다음 세션
    }
    return null;
  }

  function ddayPill(info) {
    if (!info) return `<span class="dday-pill dday-done">올해 종료</span>`;
    if (info.status === 'always')  return `<span class="dday-pill dday-always">상시</span>`;
    if (info.status === 'waiting') return `<span class="dday-pill dday-wait">결과 대기중</span>`;
    const { diff } = info;
    if (diff === 0) return `<span class="dday-pill dday-today">D-Day</span>`;
    if (diff <= 7)  return `<span class="dday-pill dday-hot">D-${diff}</span>`;
    if (diff <= 30) return `<span class="dday-pill dday-soon">D-${diff}</span>`;
    return `<span class="dday-pill dday-ok">D-${diff}</span>`;
  }

  // 국가기술자격은 grade별로 묶어 대표 1행씩만 표시
  const displayList = [];
  const gradesSeen = new Set(), schedSeen = new Set();
  for (const ex of EXAM_SCHEDULE) {
    if (ex.cat === '국가기술자격') {
      const grade = ex.grade || '기능사';
      if (gradesSeen.has(grade)) continue;
      gradesSeen.add(grade);
      // 해당 grade의 모든 시험 중 가장 이른 upcoming 정보 선택
      const gradeExams = EXAM_SCHEDULE.filter(e => e.cat === '국가기술자격' && (e.grade || '기능사') === grade);
      let best = null;
      for (const ge of gradeExams) {
        const info = getNextInfo(ge);
        if (!best) { best = info; continue; }
        if (!info) continue;
        if (best.status === 'always') continue;
        if (info.status === 'always') { best = info; continue; }
        if (info.status === 'upcoming' && (best.status !== 'upcoming' || info.diff < best.diff)) best = info;
      }
      displayList.push({ name: `국가기술자격 (${grade})`, info: best, grp: 'nat' });
    } else {
      // 날짜가 정해진 시험은 일정이 같으면 한 줄로 묶음(예: GTQ·GTQi, 전산세무·전산회계)
      const key = JSON.stringify(ex.sessions), dated = !!parseExamDate(ex.sessions[0].wExam || ex.sessions[0].exam || ex.sessions[0].written);
      if (dated && schedSeen.has(key)) continue;
      schedSeen.add(key);
      const same = dated ? EXAM_SCHEDULE.filter(e => e.cat !== '국가기술자격' && JSON.stringify(e.sessions) === key) : [ex];
      const name = same.length > 1 ? (ex.ddName || same.map(e => e.name).join(' · ')) : ex.name;
      displayList.push({ name, info: getNextInfo(ex), grp: ex.org === KPC_ORG ? 'kpc' : ex.cat === '전산세무회계' ? 'tax' : 'always' });
    }
  }

  const EDD_GROUPS = [
    { key: 'nat', label: '국가기술자격', org: '한국산업인력공단', color: '#2563EB' },
    { key: 'kpc', label: 'KPC 자격', org: '한국생산성본부', color: '#7C3AED' },
    { key: 'tax', label: '전산세무회계', org: '한국세무사회', color: '#0D9488' },
    { key: 'always', label: '상시 시험', org: '원하는 날 응시', color: '#94A3B8' },
  ];
  const rowHtml = ({ name, info }) => {
    const s = info?.s;
    const dateStr = !info ? '-'
      : info.status === 'always' ? '연중 상시'
      : info.status === 'waiting' ? `발표: ${s.result2 || s.result}`
      : (s.wExam || s.exam || s.written);
    return `<tr>
      <td><span class="edd-name">${name}</span></td>
      <td class="edd-round">${s ? s.round : '-'}</td>
      <td class="edd-date">${dateStr}</td>
      <td>${ddayPill(info)}</td>
    </tr>`;
  };
  const rows = EDD_GROUPS.map(g => {
    const list = displayList.filter(d => d.grp === g.key);
    if (!list.length) return '';
    return `<tbody class="edd-sec" style="--g:${g.color}"><tr class="edd-group"><td colspan="4"><span class="edd-group__name">${g.label}</span><span class="edd-group__org">${g.org}</span></td></tr>${list.map(rowHtml).join('')}</tbody>`;
  }).join('');

  return `<div class="exam-dday-wrap">
    <table class="exam-dday-table">
      <thead><tr><th>자격증</th><th>회차</th><th>시험 일정</th><th>D-Day</th></tr></thead>
      ${rows}
    </table>
  </div>`;
}

function parseExamDate(str) {
  if (!str || str === '-') return null;
  // "2025-01-18~19" → 첫 번째 날짜만, 현지 자정 기준으로 파싱
  const m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

// 같은 탭 안에서 회차 일정이 똑같은 자격증은 표 하나로 합치고, 해당 자격증 이름을 표 아래에 묶어서 보여줌
function _mergeSameSchedule(list) {
  const groups = [];
  list.forEach(ex => {
    const key = JSON.stringify(ex.sessions), g = groups.find(x => x.key === key);
    if (g) g.items.push(ex); else groups.push({ key, items: [ex] });
  });
  return groups.map(({ items }) => items.length === 1 ? items[0] : Object.assign({}, items[0], {
    name: `${items[0].grade || items[0].cat} 시험 일정`,
    certs: items.map(e => e.name),
    note: [...new Set(items.map(e => e.note).filter(Boolean))],
  }));
}

function _buildExamCard(ex, today, soon) {
  const md = v => String(v).replace(/^\d{4}-/, '');
  const sessionRows = ex.sessions.map(s => {
    const d = parseExamDate(s.wExam || s.exam || s.written);
    const wCell = s.wExam ? `접수 ${md(s.wReg)}<br>시험 ${md(s.wExam)}<br>발표 ${md(s.wPass)}` : s.reg || s.written;
    const pCell = s.pExam ? `접수 ${md(s.pReg)}<br>시험 ${md(s.pExam)}` : s.reg ? s.exam : s.practical;
    const rCell = s.result2 ? `1차 ${md(s.result)}<br>2차 ${md(s.result2)}` : s.result;
    const isUp = d && d >= today && d <= soon;
    const badge = isUp ? `<span class="exam-upcoming-badge">예정</span>` : '';
    return `<tr${isUp ? ' class="is-upcoming"' : ''}>
      <td>${s.round}${badge}</td>
      <td>${wCell}</td>
      <td>${pCell}</td>
      <td>${rCell}</td>
    </tr>`;
  }).join('');
  const regBox = ex.registerUrl ? `
    <div class="exam-reg-box">
      <div class="exam-reg-title">시험 접수 안내</div>
      <a href="${ex.registerUrl}" class="exam-reg-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>
        접수 바로가기
      </a>
      ${(ex.registerNote || []).length ? `<ul class="exam-reg-list">${ex.registerNote.map(n => `<li>${n}</li>`).join('')}</ul>` : ''}
    </div>` : '';
  return `
    <div class="exam-card">
      <div class="exam-card__head">
        <span class="exam-card__name">${ex.name}</span>
        <span class="exam-card__org">${ex.org}</span>
      </div>
      <div class="exam-table-wrap">
        <table class="exam-table">
          <thead><tr><th>회차</th>${ex.sessions.some(s => s.reg) ? '<th>원서 접수</th><th>시험일</th>' : '<th>필기(접수·시험)</th><th>실기(접수·시험)</th>'}<th>합격자 발표</th></tr></thead>
          <tbody>${sessionRows}</tbody>
        </table>
      </div>
      ${ex.certs ? `<div class="exam-certs"><p class="exam-certs__t">이 일정으로 보는 자격증 ${ex.certs.length}개</p><ul class="exam-certs__list">${ex.certs.map(n => `<li>${n}</li>`).join('')}</ul></div>` : ''}
      ${regBox}
      ${[].concat(ex.note || []).map(n => `<p class="exam-notice">※ ${n}</p>`).join('')}
      <p class="exam-notice">※ 일정은 시행처 공고 기준이며 변동될 수 있습니다. 반드시 공식 홈페이지에서 재확인하세요.</p>
    </div>`;
}
